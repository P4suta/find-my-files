name: Bounded parser fuzz target
description: Run one parser target with shared compiler outputs and an explicit time budget.
inputs:
  target:
    description: Fuzz binary declared in engine/fuzz/Cargo.toml.
    required: true
  seconds:
    description: Maximum exploration time for this target.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FUZZ_TARGET: ${{ inputs.target }}
      run: mkdir -p "build/fuzz/corpus/$FUZZ_TARGET" "build/fuzz/artifacts/$FUZZ_TARGET"
    - shell: bash
      working-directory: engine
      env:
        FUZZ_TARGET: ${{ inputs.target }}
        FUZZ_SECONDS: ${{ inputs.seconds }}
      run: >-
        cargo fuzz run "$FUZZ_TARGET"
        --target x86_64-unknown-linux-gnu
        "../build/fuzz/corpus/$FUZZ_TARGET"
        --
        "-artifact_prefix=../build/fuzz/artifacts/$FUZZ_TARGET/"
        -max_total_time="$FUZZ_SECONDS"
