# Install the repository's exact Rust version through the standard dtolnay
# action. CI does not install or execute mise; it only reads the shared version
# declaration rather than floating on `stable`.
#
# This composite hands that version to dtolnay/rust-toolchain, so CI remains
# native GitHub Actions while local environment provisioning remains mise-owned.
# (fuzz.yml is the one exception: it needs nightly-only sanitizer support, so it
# keeps a direct dtolnay step with an explicitly dated nightly.)
name: Rust toolchain (repository-pinned)
description: Install the repository-pinned Rust toolchain without invoking mise.
inputs:
  components:
    description: Comma-separated rustup components (e.g. "clippy, rustfmt").
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      # mise.toml line: `rust = "1.96"`. awk (not `grep -oP`, whose PCRE is absent
      # from the windows runners' Git Bash) splits on the quotes and takes the value.
      run: |
        version=$(awk -F'"' '/^rust[[:space:]]*=/{print $2; exit}' mise.toml)
        if [ -z "$version" ]; then
          echo "::error::could not read the rust pin from mise.toml"; exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Using repository-pinned Rust $version"
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable-branch pin; `toolchain` overrides what it installs
      with:
        toolchain: ${{ steps.pin.outputs.version }}
        components: ${{ inputs.components }}
