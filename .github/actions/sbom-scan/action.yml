name: Generate SBOMs and scan for vulnerabilities
description: >-
  Generate deterministic, artifact-derived Rust + .NET CycloneDX 1.6 SBOMs
  into build/sbom/ and gate on known-vulnerable dependencies. Requires pinned
  Rust/.NET toolchains, a validated distribution tree, and locked NuGet restore
  evidence. No secrets needed.

runs:
  using: composite
  steps:
    - name: Install cargo-sbom
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $cargoRoot = Join-Path $env:RUNNER_TEMP "fmf-cargo-sbom"
        cargo install cargo-sbom --locked --version 0.10.0 --root $cargoRoot
        $cargoSbom = Join-Path $cargoRoot "bin\cargo-sbom.exe"
        if (-not (Test-Path -LiteralPath $cargoSbom -PathType Leaf)) {
          throw "cargo-sbom installation did not produce $cargoSbom"
        }

    - name: Install osv-scanner
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: osv-scanner@2.3.6
        fallback: none

    - name: Generate and normalize artifact-derived SBOMs
      working-directory: engine
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $cargoRoot = Join-Path $env:RUNNER_TEMP "fmf-cargo-sbom"
        $env:PATH = "$(Join-Path $cargoRoot 'bin');$env:PATH"
        $rawDirectory = Join-Path $env:RUNNER_TEMP "fmf-sbom-raw"
        if (Test-Path -LiteralPath $rawDirectory) {
          throw "Raw cargo-sbom directory already exists: $rawDirectory"
        }
        New-Item -ItemType Directory -Path $rawDirectory | Out-Null
        # cargo-sbom 0.10.0 has no --locked switch. Prove Cargo.lock is already
        # complete so the generator cannot repair or mutate the reviewed graph.
        cargo metadata --locked --format-version 1 --no-deps | Out-Null
        cargo sbom --cargo-package fmf-service --output-format cyclone_dx_json_1_6 |
          Out-File -LiteralPath (Join-Path $rawDirectory "fmf-service.cdx.json") -Encoding utf8NoBOM
        cargo sbom --cargo-package fmf-ffi --output-format cyclone_dx_json_1_6 |
          Out-File -LiteralPath (Join-Path $rawDirectory "fmf-ffi.cdx.json") -Encoding utf8NoBOM
        cargo sbom --cargo-package fmf-launcher --output-format cyclone_dx_json_1_6 |
          Out-File -LiteralPath (Join-Path $rawDirectory "fmf-launcher.cdx.json") -Encoding utf8NoBOM
        Set-Location ..
        just sbom $env:FMF_BUILD_VERSION $rawDirectory

    - name: Verify the canonical SBOM pair before scanning
      shell: pwsh
      run: just sbom-verify $env:FMF_BUILD_VERSION

    - name: Scan SBOMs for known vulnerabilities (gate)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $scanDirectory = Join-Path $env:RUNNER_TEMP (
          "fmf-sbom-scan-{0}-{1}-{2}" -f
            $env:GITHUB_RUN_ID,
            $env:GITHUB_RUN_ATTEMPT,
            $env:GITHUB_JOB
        )
        if (Test-Path -LiteralPath $scanDirectory) {
          throw "Disposable SBOM scan directory already exists: $scanDirectory"
        }
        New-Item -ItemType Directory -Path $scanDirectory | Out-Null
        Copy-Item -LiteralPath build/sbom/fmf-engine.cdx.json -Destination $scanDirectory
        Copy-Item -LiteralPath build/sbom/app.cdx.json -Destination $scanDirectory
        osv-scanner scan source `
          -L (Join-Path $scanDirectory "fmf-engine.cdx.json") `
          -L (Join-Path $scanDirectory "app.cdx.json") `
          --config osv-scanner.toml

    - name: Verify the canonical SBOM pair after scanning
      shell: pwsh
      run: just sbom-verify $env:FMF_BUILD_VERSION
