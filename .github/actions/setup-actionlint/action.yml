# Install the exact upstream actionlint binary used by the Linux hygiene job.
#
# This is intentionally a tiny repository-owned verifier instead of another
# third-party setup Action. Identity (release URL), length, and digest are all
# fixed, extraction is limited to the one executable we invoke, and the tool
# never lands in the checkout.
name: Setup actionlint (verified)
description: Install the pinned actionlint Linux release after exact size and SHA-256 verification.
outputs:
  executable:
    description: Absolute path to the verified actionlint executable.
    value: ${{ steps.install.outputs.executable }}
runs:
  using: composite
  steps:
    - name: Download and verify actionlint
      id: install
      shell: bash
      env:
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        ACTIONLINT_SIZE: "2353908"
      run: |
        set -euo pipefail

        install_dir="${RUNNER_TEMP}/fmf-actionlint-${ACTIONLINT_VERSION}"
        archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        asset_uri="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

        if [[ -e "$install_dir" || -e "$archive" ]]; then
          echo "Refusing to replace an existing actionlint staging path." >&2
          exit 1
        fi
        mkdir --mode=0700 "$install_dir"

        curl \
          --fail \
          --location \
          --proto '=https' \
          --retry 3 \
          --show-error \
          --silent \
          --tlsv1.2 \
          --output "$archive" \
          "$asset_uri"

        actual_size="$(stat --format='%s' "$archive")"
        if [[ "$actual_size" != "$ACTIONLINT_SIZE" ]]; then
          echo "actionlint archive size is ${actual_size}; expected ${ACTIONLINT_SIZE}." >&2
          exit 1
        fi
        printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict -

        archive_entries="$(tar --list --gzip --file "$archive")"
        if [[ "$(grep --count --line-regexp 'actionlint' <<<"$archive_entries")" != "1" ]]; then
          echo "actionlint archive does not contain exactly one root actionlint executable." >&2
          exit 1
        fi
        tar --extract --gzip --file "$archive" --directory "$install_dir" -- actionlint
        chmod 0755 "$install_dir/actionlint"

        # `-version` prints the version, the install source, and the build
        # toolchain on three separate lines. Take the first line by parameter
        # expansion rather than `head`, which would close the pipe early and
        # trip `pipefail`.
        version_report="$("$install_dir/actionlint" -version)"
        actual_version="${version_report%%$'\n'*}"
        if [[ "$actual_version" != "$ACTIONLINT_VERSION" ]]; then
          echo "actionlint reported '${actual_version}'; expected '${ACTIONLINT_VERSION}'." >&2
          exit 1
        fi

        printf 'executable=%s\n' "$install_dir/actionlint" >> "$GITHUB_OUTPUT"
