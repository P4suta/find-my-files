name: Setup WinAppCli (verified)
description: Install the pinned Microsoft WinAppCli release with fail-closed byte and signer verification.
outputs:
  cli-path:
    description: Absolute path to the verified winapp.exe in runner temp.
    value: ${{ steps.install.outputs.cli-path }}
runs:
  using: composite
  steps:
    - name: Download and verify WinAppCli
      id: install
      shell: pwsh
      env:
        WINAPP_VERSION: "0.7.1"
        WINAPP_SHA256: d925d1e32cdc320b6d271f653fd2cd3c05b5d7558deb20d1b548bead77900fcf
        WINAPP_SIZE: "99013508"
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        $assetUri = "https://github.com/microsoft/winappCli/releases/download/v$env:WINAPP_VERSION/winappcli-x64.zip"
        $archive = Join-Path $env:RUNNER_TEMP "fmf-winappcli-$env:WINAPP_VERSION.zip"
        $installDirectory = Join-Path $env:RUNNER_TEMP "fmf-winappcli-$env:WINAPP_VERSION"
        if ((Test-Path -LiteralPath $installDirectory) -or
            (Test-Path -LiteralPath $archive)) {
          throw "Refusing to replace an existing WinAppCli staging path."
        }

        Invoke-WebRequest -Uri $assetUri -OutFile $archive

        $actualSize = (Get-Item -LiteralPath $archive).Length
        $expectedSize = [Int64]::Parse(
          $env:WINAPP_SIZE,
          [Globalization.CultureInfo]::InvariantCulture
        )
        if ($actualSize -ne $expectedSize) {
          throw "WinAppCli archive size is $actualSize bytes; expected $expectedSize."
        }

        $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
        if ($actualHash -cne $env:WINAPP_SHA256.ToUpperInvariant()) {
          throw "WinAppCli SHA-256 is '$actualHash'; expected '$env:WINAPP_SHA256'."
        }

        Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory
        $commands = @(Get-ChildItem -LiteralPath $installDirectory -Recurse -File -Filter winapp.exe)
        if ($commands.Count -ne 1) {
          throw "WinAppCli archive contained $($commands.Count) winapp.exe files; expected exactly one."
        }
        $expectedCommand = [IO.Path]::GetFullPath(
          (Join-Path $installDirectory "winapp.exe")
        )
        $actualCommand = [IO.Path]::GetFullPath($commands[0].FullName)
        if (-not [StringComparer]::OrdinalIgnoreCase.Equals($actualCommand, $expectedCommand)) {
          throw "WinAppCli executable moved from its pinned archive location: '$($commands[0].FullName)'."
        }

        $peFiles = @(
          Get-ChildItem -LiteralPath $installDirectory -Recurse -File |
            Where-Object { $_.Extension -ieq ".exe" -or $_.Extension -ieq ".dll" }
        )
        if ($peFiles.Count -eq 0) {
          throw "WinAppCli archive contained no PE files."
        }
        foreach ($file in $peFiles) {
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          $subject = [string]$signature.SignerCertificate.Subject
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "WinAppCli Authenticode status is '$($signature.Status)' for '$($file.FullName)'."
          }
          if ($subject -cnotmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
            throw "WinAppCli file '$($file.FullName)' is not signed by Microsoft Corporation: '$subject'."
          }
        }

        $versionOutput = ((& $commands[0].FullName --version) -join "`n")
        if ($versionOutput.Trim() -cne $env:WINAPP_VERSION) {
          throw "Expected WinAppCli $env:WINAPP_VERSION; --version reported: $versionOutput"
        }

        "cli-path=$actualCommand" |
          Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
