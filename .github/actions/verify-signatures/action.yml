name: Verify Authenticode state
description: >-
  Fail-closed verification for every manifest-defined first-party PE. Before
  signing, require an empty PE certificate table and NotSigned status. After
  signing, require exactly one non-nested Authenticode signature, a valid chain,
  an RFC 3161 timestamp, and the exact committed leaf certificate identity.

inputs:
  bundle-dir:
    description: "Bundle root holding FindMyFiles.exe and app\\ (no trailing slash)."
    required: true
  expected-state:
    description: "Exact expected Authenticode state: unsigned or signed."
    required: false
    default: signed
  signer-common-name:
    description: "Exact signer certificate common name (signed mode)."
    required: false
    default: ""
  signer-subject:
    description: "Exact signer certificate distinguished subject (signed mode)."
    required: false
    default: ""
  signer-issuer:
    description: "Exact signer certificate distinguished issuer (signed mode)."
    required: false
    default: ""
  signer-certificate-sha256:
    description: "Lowercase SHA-256 of the exact DER leaf certificate (signed mode)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify Authenticode state
      shell: pwsh
      env:
        BUNDLE_DIR: ${{ inputs.bundle-dir }}
        EXPECTED_STATE: ${{ inputs.expected-state }}
        SIGNER_COMMON_NAME: ${{ inputs.signer-common-name }}
        SIGNER_SUBJECT: ${{ inputs.signer-subject }}
        SIGNER_ISSUER: ${{ inputs.signer-issuer }}
        SIGNER_CERTIFICATE_SHA256: ${{ inputs.signer-certificate-sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'

        function Read-U16 {
          param([byte[]] $Bytes, [long] $Offset, [string] $Field)
          if ($Offset -lt 0 -or $Offset + 2 -gt $Bytes.LongLength) {
            throw "PE field '$Field' is outside the file."
          }
          return [BitConverter]::ToUInt16($Bytes, [int]$Offset)
        }

        function Read-U32 {
          param([byte[]] $Bytes, [long] $Offset, [string] $Field)
          if ($Offset -lt 0 -or $Offset + 4 -gt $Bytes.LongLength) {
            throw "PE field '$Field' is outside the file."
          }
          return [BitConverter]::ToUInt32($Bytes, [int]$Offset)
        }

        function Get-PeCertificateEntries {
          param([Parameter(Mandatory)] [string] $Path)

          $bytes = [IO.File]::ReadAllBytes($Path)
          if ($bytes.LongLength -lt 64 -or
              $bytes[0] -ne [byte][char]'M' -or
              $bytes[1] -ne [byte][char]'Z') {
            throw "'$Path' is not a bounded MZ/PE image."
          }

          $peOffset = [long](Read-U32 $bytes 0x3c 'e_lfanew')
          if ($peOffset + 24 -gt $bytes.LongLength -or
              $bytes[[int]$peOffset] -ne [byte][char]'P' -or
              $bytes[[int]($peOffset + 1)] -ne [byte][char]'E' -or
              $bytes[[int]($peOffset + 2)] -ne 0 -or
              $bytes[[int]($peOffset + 3)] -ne 0) {
            throw "'$Path' has an invalid PE header."
          }

          $optionalHeader = $peOffset + 24
          $magic = Read-U16 $bytes $optionalHeader 'optional-header magic'
          $dataDirectories = switch ($magic) {
            0x10b { $optionalHeader + 96 }
            0x20b { $optionalHeader + 112 }
            default { throw "'$Path' has unsupported optional-header magic 0x$($magic.ToString('x'))." }
          }
          $securityDirectory = $dataDirectories + (4 * 8)
          $certificateOffset = [long](Read-U32 $bytes $securityDirectory 'certificate-table offset')
          $certificateSize = [long](Read-U32 $bytes ($securityDirectory + 4) 'certificate-table size')
          if ($certificateOffset -eq 0 -and $certificateSize -eq 0) {
            return @()
          }
          if ($certificateOffset -eq 0 -or $certificateSize -eq 0) {
            throw "'$Path' has a half-populated PE certificate directory."
          }
          $certificateEnd = $certificateOffset + $certificateSize
          if ($certificateEnd -ne $bytes.LongLength) {
            throw "'$Path' certificate table must end exactly at EOF."
          }

          $entries = @()
          $cursor = $certificateOffset
          while ($cursor -lt $certificateEnd) {
            $length = [long](Read-U32 $bytes $cursor 'WIN_CERTIFICATE.dwLength')
            if ($length -lt 8 -or $cursor + $length -gt $certificateEnd) {
              throw "'$Path' has an invalid WIN_CERTIFICATE length."
            }
            $revision = Read-U16 $bytes ($cursor + 4) 'WIN_CERTIFICATE.wRevision'
            $certificateType = Read-U16 $bytes ($cursor + 6) 'WIN_CERTIFICATE.wCertificateType'
            if ($revision -ne 0x0200 -or $certificateType -ne 0x0002) {
              throw "'$Path' contains a non-PKCS#7 WIN_CERTIFICATE entry."
            }

            $contentLength = [int]($length - 8)
            $content = [byte[]]::new($contentLength)
            [Array]::Copy($bytes, [int]($cursor + 8), $content, 0, $contentLength)
            $entries += ,$content

            $alignedLength = ($length + 7) -band (-bnot 7)
            $alignedEnd = $cursor + $alignedLength
            if ($alignedEnd -gt $certificateEnd) {
              throw "'$Path' has truncated WIN_CERTIFICATE alignment padding."
            }
            for ($padding = $cursor + $length; $padding -lt $alignedEnd; $padding++) {
              if ($bytes[[int]$padding] -ne 0) {
                throw "'$Path' has non-zero WIN_CERTIFICATE alignment padding."
              }
            }
            $cursor = $alignedEnd
          }
          if ($cursor -ne $certificateEnd) {
            throw "'$Path' certificate entries do not cover the declared table."
          }
          return @($entries)
        }

        function Find-SignTool {
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $sdkDirectories = @(
            Get-ChildItem -LiteralPath $kitRoot -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                try {
                  [pscustomobject]@{
                    Directory = $_.FullName
                    Version = [Version]$_.Name
                  }
                }
                catch {
                  # Non-version SDK helper directories are not candidates.
                }
              } |
              Sort-Object Version -Descending
          )
          foreach ($sdk in $sdkDirectories) {
            foreach ($architecture in @('x64', 'x86')) {
              $candidate = Join-Path $sdk.Directory "$architecture\signtool.exe"
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                return $candidate
              }
            }
          }
          throw 'signtool.exe not found under a versioned Windows SDK directory.'
        }

        $mode = [string]$env:EXPECTED_STATE
        if ($mode -cnotin @('unsigned', 'signed')) {
          throw "expected-state must be exactly 'unsigned' or 'signed'."
        }

        $expectedCommonName = [string]$env:SIGNER_COMMON_NAME
        $expectedSubject = [string]$env:SIGNER_SUBJECT
        $expectedIssuer = [string]$env:SIGNER_ISSUER
        $expectedCertificateSha256 = [string]$env:SIGNER_CERTIFICATE_SHA256
        if ($mode -ceq 'signed') {
          if ([string]::IsNullOrWhiteSpace($expectedCommonName) -or
              [string]::IsNullOrWhiteSpace($expectedSubject) -or
              [string]::IsNullOrWhiteSpace($expectedIssuer) -or
              $expectedCertificateSha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'signed mode requires exact nonblank signer identity and a lowercase SHA-256 leaf certificate hash.'
          }
        }

        $bundle = (Resolve-Path -LiteralPath $env:BUNDLE_DIR).Path.TrimEnd('\', '/')
        $manifest = Join-Path $env:GITHUB_ACTION_PATH 'first-party-pes.txt'
        if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
          throw "signed-PE manifest not found at '$manifest'."
        }
        $targets = @(
          Get-Content -LiteralPath $manifest |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -ne '' }
        )
        if ($targets.Count -eq 0) {
          throw "signed-PE manifest '$manifest' is empty; refusing a vacuous verification."
        }
        if (@($targets | Sort-Object -Unique).Count -ne $targets.Count) {
          throw "signed-PE manifest '$manifest' contains duplicate paths."
        }

        $signTool = if ($mode -ceq 'signed') { Find-SignTool } else { $null }
        foreach ($relative in $targets) {
          if ($relative -cnotmatch '^[A-Za-z0-9._/-]+$' -or
              $relative.StartsWith('/') -or
              @($relative.Split('/')) -contains '..') {
            throw "signed-PE manifest contains unsafe path '$relative'."
          }
          $nativeRelative = $relative.Replace('/', [IO.Path]::DirectorySeparatorChar)
          $path = (Resolve-Path -LiteralPath (Join-Path $bundle $nativeRelative)).Path
          $bundlePrefix = "$bundle$([IO.Path]::DirectorySeparatorChar)"
          if (-not $path.StartsWith($bundlePrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "signed-PE manifest path '$relative' escapes the bundle."
          }

          $entries = @(Get-PeCertificateEntries -Path $path)
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($mode -ceq 'unsigned') {
            if ($entries.Count -ne 0 -or
                $signature.Status -ne [Management.Automation.SignatureStatus]::NotSigned -or
                $null -ne $signature.SignerCertificate) {
              throw "'$relative' must have zero embedded signatures before signing."
            }
            Write-Host "verified unsigned: $relative"
            continue
          }

          if ($entries.Count -ne 1) {
            throw "'$relative' must contain exactly one WIN_CERTIFICATE entry; found $($entries.Count)."
          }
          Add-Type -AssemblyName System.Security.Cryptography.Pkcs
          $cms = [Security.Cryptography.Pkcs.SignedCms]::new()
          $cms.Decode($entries[0])
          if ($cms.SignerInfos.Count -ne 1) {
            throw "'$relative' must contain exactly one primary PKCS#7 signer."
          }
          $nestedSignatureOid = '1.3.6.1.4.1.311.2.4.1'
          foreach ($attribute in $cms.SignerInfos[0].UnsignedAttributes) {
            if ($attribute.Oid.Value -ceq $nestedSignatureOid) {
              throw "'$relative' contains a nested Authenticode signature."
            }
          }

          & $signTool verify /all /pa /tw /v $path
          if ($LASTEXITCODE -ne 0) {
            throw "signtool rejected '$relative' (exit $LASTEXITCODE): a signature, chain, or timestamp is invalid."
          }
          if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
            throw "Get-AuthenticodeSignature reports '$($signature.Status)' for '$relative'."
          }
          $certificate = $signature.SignerCertificate
          if ($null -eq $certificate) {
            throw "Get-AuthenticodeSignature returned no signer certificate for '$relative'."
          }
          $actualCommonName = $certificate.GetNameInfo(
            [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          $actualCertificateSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($certificate.RawData)
          ).ToLowerInvariant()
          if (-not [String]::Equals(
                $actualCommonName,
                $expectedCommonName,
                [StringComparison]::Ordinal
              ) -or
              -not [String]::Equals(
                $certificate.Subject,
                $expectedSubject,
                [StringComparison]::Ordinal
              ) -or
              -not [String]::Equals(
                $certificate.Issuer,
                $expectedIssuer,
                [StringComparison]::Ordinal
              ) -or
              $actualCertificateSha256 -cne $expectedCertificateSha256) {
            throw "unexpected signer certificate for '$relative' (CN '$actualCommonName', SHA-256 '$actualCertificateSha256')."
          }
          Write-Host "verified signed: $relative - exact leaf certificate, chain, and timestamp"
        }
