version: 2
updates:
  # Shipped Rust workspace plus the deliberately standalone fuzz workspace;
  # each owns a Cargo.lock and therefore needs an explicit update root.
  - package-ecosystem: cargo
    directories:
      - /engine
      - /engine/fuzz
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # xtask is a separate workspace with its own Cargo.lock (ADR-0018); cargo-audit
  # scans it for advisories, but only Dependabot opens the bump PRs.
  - package-ecosystem: cargo
    directory: /xtask
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      xtask-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # C# app — one nuget entry per project directory.
  # Root .NET tool manifest (`.config/dotnet-tools.json`, currently Stryker).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      dotnet-tools:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: nuget
    directory: /app/FindMyFiles
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      dotnet-app:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: nuget
    directory: /app/FindMyFiles.Tests
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      dotnet-tests:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Workflow actions plus dependencies used by repository-local composite
  # actions. GitHub's root sentinel scans .github/workflows; each immediate
  # action directory is also a manifest location and must be included explicitly.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
