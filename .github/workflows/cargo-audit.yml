# RustSec advisory scan over the committed lockfiles (engine + xtask). The
# scheduled run catches newly-disclosed advisories even when nothing changed.
name: cargo-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 4 * * 1"
  workflow_dispatch:

concurrency:
  group: cargo-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: cargo audit (engine)
        run: cargo audit
        working-directory: engine
      - name: cargo audit (xtask)
        run: cargo audit
        working-directory: xtask
