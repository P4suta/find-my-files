# RustSec advisory scan over the committed lockfiles (engine + xtask). The
# scheduled run catches newly-disclosed advisories even when nothing changed.
name: cargo-audit

on:
  push:
    branches: [main]
    paths:
      - "engine/**/Cargo.toml"
      - "engine/**/Cargo.lock"
      - "xtask/Cargo.toml"
      - "xtask/Cargo.lock"
  pull_request:
    paths:
      - "engine/**/Cargo.toml"
      - "engine/**/Cargo.lock"
      - "xtask/Cargo.toml"
      - "xtask/Cargo.lock"
  schedule:
    - cron: "33 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit
      - name: cargo audit (engine)
        run: cargo audit
        working-directory: engine
      - name: cargo audit (xtask)
        run: cargo audit
        working-directory: xtask
