name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      full_assurance:
        description: Run the full release candidate verification inventory.
        type: boolean
        default: false
      target_sha:
        description: Exact candidate commit admitted by release preflight.
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read

jobs:
  changes:
    name: changes
    permissions:
      contents: read
      pull-requests: read # Permission: Select checks from the changed PR files.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ inputs.full_assurance || steps.f.outputs.code }}
      assurance: ${{ inputs.full_assurance || false }}
      comments: ${{ inputs.full_assurance || steps.f.outputs.comments }}
      fuzz: ${{ inputs.full_assurance || false }}
      fuzz_surfaces: '["fuzz_all"]'
      bench: ${{ inputs.full_assurance || steps.f.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            comments:
              - 'engine/**'
              - 'app/**'
              - 'xtask/**'
              - '.github/**'
              - 'mise.toml'
              - 'lefthook.yml'
              - 'renovate.local.json5'
              - '.ocomment.toml'
            code:
              - 'engine/**'
              - 'app/**'
              - 'contract/**'
              - 'xtask/**'
              - 'mise.toml'
              - 'justfile'
              - 'lefthook.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.github/actions/**'
              # Workflow behavior is executable release/build logic. Keep this
              # future-proof instead of hand-maintaining an allowlist that can
              # silently omit a newly added gate.
              - '.github/workflows/**'
            bench:
              - 'engine/crates/fmf-core/**'
              - 'engine/crates/fmf-runtime/**'
              - 'engine/benches/**'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'mise.toml'
              - '.github/actions/rust-toolchain/**'
              - '.github/workflows/ci.yml'

  hygiene:
    name: hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      # shellcheck over run: blocks. Catches workflow errors before a release run.
      - uses: $/.github/actions/setup-actionlint
        id: actionlint
      - run: '"$ACTIONLINT"'
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor@1.31.1,typos-cli@1.51.1,taplo-cli@0.10.0
          fallback: none
      - name: Audit GitHub Actions security
        run: zizmor --offline --strict-collection --persona auditor --min-severity low .
      - name: Check spelling
        run: typos
      - run: taplo fmt --check
      - uses: $/.github/actions/rust-toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: engine
      - run: cargo fmt --all --check
        working-directory: engine/fuzz

  deny:
    name: deny
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check bans licenses sources
        working-directory: engine

  machete:
    name: machete
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - run: cargo machete engine

  contract-lint:
    name: contract-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p fmf-contract -p fmf-proto --all-targets -- -D warnings
        working-directory: engine

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pull-requests: read # Permission: Validate the PR title through the API.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  xtask-build:
    name: xtask-build
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.full_assurance && 360 || 60 }}
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: xtask
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - run: cargo fmt --all --check
        working-directory: xtask
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: xtask
      - run: cargo nextest run --locked --profile ci
        working-directory: xtask
      - name: Check the registered proof inventory
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- proof-check
      - name: Install the source-pinned comment checker
        if: needs.changes.outputs.comments == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- verification-tools comments
      - name: Check source comments
        if: needs.changes.outputs.comments == 'true'
        run: ocomment check --jobs 2 --format github engine app xtask .github mise.toml lefthook.yml renovate.local.json5
      - name: Upload xtask nextest JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask-nextest-junit
          path: build/xtask/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  proof:
    name: proof (${{ matrix.shard }})
    needs: [changes, xtask-build]
    if: needs.changes.outputs.assurance == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: xtask
          shared-key: xtask
          save-if: false
      - name: Install the checksum-verified prover
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- verification-tools kani
      - name: Verify the registered production harnesses
        env:
          PROOF_SHARD: ${{ matrix.shard }}
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- proof-shard --index "$PROOF_SHARD" --count 4
      - name: Upload the original partition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-proof-shard-${{ matrix.shard }}
          path: build/verification/proof-shard-${{ matrix.shard }}/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  xtask:
    name: xtask
    needs: [changes, xtask-build, proof]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require every applicable prerequisite
        if: needs.changes.result != 'success' || needs.xtask-build.result != 'success' || (needs.changes.outputs.assurance == 'true' && needs.proof.result != 'success')
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.assurance == 'true'
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
        if: needs.changes.outputs.assurance == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.assurance == 'true'
        with:
          workspaces: xtask
          shared-key: xtask
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.assurance == 'true'
        with:
          name: production-proof-shard-0
          path: build/verification/proof-shard-0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.assurance == 'true'
        with:
          name: production-proof-shard-1
          path: build/verification/proof-shard-1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.assurance == 'true'
        with:
          name: production-proof-shard-2
          path: build/verification/proof-shard-2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.assurance == 'true'
        with:
          name: production-proof-shard-3
          path: build/verification/proof-shard-3
      - name: Collect every registered production harness
        if: needs.changes.outputs.assurance == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- proof-collect --count 4
      - name: Install the pinned interpreter toolchain
        if: needs.changes.outputs.assurance == 'true'
        run: rustup toolchain install nightly-2026-11-04 --profile minimal --component miri --component rust-src
      - name: Interpret the codec boundary tests
        if: needs.changes.outputs.assurance == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- miri
      - name: Upload proof evidence
        if: always() && needs.changes.outputs.assurance == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-proofs
          path: |
            build/verification/*.json
            build/verification/proof-shard-*/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  engine-build-test:
    name: engine-build-test
    needs: [hygiene, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine-win
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151
          fallback: none
      - name: clippy (compiles the engine; later steps reuse it)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: engine
      - name: uninstrumented pipe page latency gate
        run: cargo nextest run --locked --workspace --profile ci-latency -E 'test(page_roundtrip_stays_inside_the_latency_budget)'
        working-directory: engine
      - name: test + line coverage gate
        run: |
          mkdir -p ../build/coverage
          cargo llvm-cov nextest --locked --workspace --profile ci-coverage --fail-under-lines 76 --lcov --output-path ../build/coverage/engine-lcov.info -E 'not test(page_roundtrip_stays_inside_the_latency_budget)'
        working-directory: engine
      - name: Upload engine nextest JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-nextest-junit
          path: |
            build/engine/nextest/ci-latency/latency.xml
            build/engine/nextest/ci-coverage/coverage.xml
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - name: doctest
        run: cargo test --locked --workspace --exclude fmf-ffi --doc
        working-directory: engine
      - name: doc (warnings = errors)
        run: cargo doc --locked --workspace --no-deps
        working-directory: engine
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: build shipped engine dll + service + launcher (release)
        run: cargo build --locked --release -p fmf-ffi -p fmf-service -p fmf-launcher
        working-directory: engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-release
          path: |
            build/engine/release/fmf_engine.dll
            build/engine/release/fmf-service.exe
            build/engine/release/fmf-launcher.exe
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: build/coverage/engine-lcov.info
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  app:
    name: app
    needs: [engine-build-test]
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: xtask
          shared-key: app-xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-release
          path: build/engine/release/
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403
      - uses: $/.github/actions/setup-winapp
        id: winapp
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0,cargo-about@0.9.3
          fallback: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: publish app (SkipRustBuild — engine binaries are prebuilt)
        run: just publish-app true
      - name: shipping bundle startup smoke (no test seams)
        run: just ui-test-stable-smoke
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}
      - name: test app + coverage gate (line+branch, UI-excluded)
        run: just test-app-cov true
      - name: pipe integration (C# client × real service, unelevated)
        run: >-
          dotnet test app/FindMyFiles.Tests --settings app/FindMyFiles.Tests/pipe.runsettings
          --results-directory build/test-results/pipe
          -p:SkipRustBuild=true -p:RestoreLockedMode=true
      - name: publish isolated UI-test bundle
        run: just publish-ui-test true
      - name: UI-test bundle automation
        run: just ui-test-published
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}
      - name: upload UI automation evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-automation-failure
          path: build/ui-automation/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: find-my-files-win-x64
          path: build/dist/FindMyFiles/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  bench:
    name: bench
    needs: [hygiene, changes]
    if: needs.changes.outputs.bench == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: $/.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine-win
          save-if: false
      - run: cargo bench --locked -p fmf-runtime --features testutil -- --test
        working-directory: engine

  fuzz:
    name: fuzz
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/fuzz.yml
    with:
      surfaces: ${{ needs.changes.outputs.fuzz_surfaces }}
      target_sha: ${{ inputs.target_sha || github.sha }}

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [changes, hygiene, deny, machete, contract-lint, pr-title, xtask, engine-build-test, app, bench, fuzz]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require complete candidate verification
        env:
          FULL_ASSURANCE: ${{ inputs.full_assurance || false }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          jq -n -e --argjson full "$FULL_ASSURANCE" --argjson jobs "$JOBS" '
            def fast_ready:
              type == "object" and length > 0 and
              all(.[]; type == "object" and (.result == "success" or .result == "skipped"));
            def release_ready:
              . as $jobs |
              .changes.outputs.assurance == "true" and
              all(["hygiene", "deny", "machete", "contract-lint", "xtask",
                   "engine-build-test", "app", "bench", "fuzz"][];
                  $jobs[.].result == "success");
            def accepts($full):
              fast_ready and (if $full then release_ready else true end);
            {
              changes: {result: "success", outputs: {assurance: "true"}},
              hygiene: {result: "success"},
              deny: {result: "success"},
              machete: {result: "success"},
              "contract-lint": {result: "success"},
              "pr-title": {result: "skipped"},
              xtask: {result: "success"},
              "engine-build-test": {result: "success"},
              app: {result: "success"},
              bench: {result: "success"},
              fuzz: {result: "success"}
            } as $complete |
            [
              ($complete | accepts(true)),
              ($complete | .xtask.result = "failure" | accepts(true) | not),
              ($complete | .xtask.result = "cancelled" | accepts(true) | not),
              ($complete | .xtask.result = "skipped" | accepts(true) | not),
              ($complete | del(.xtask) | accepts(true) | not),
              ($complete | .fuzz.result = "skipped" | accepts(true) | not),
              ($complete | del(.fuzz) | accepts(true) | not),
              ($complete | .changes.outputs.assurance = "false" | accepts(true) | not),
              ($complete | del(.changes.outputs.assurance) | accepts(true) | not),
              ($complete | .app.result = "unknown" | accepts(true) | not),
              ({} | accepts(false) | not),
              ({job: {result: "skipped"}} | accepts(false)),
              ({job: {result: "cancelled"}} | accepts(false) | not),
              ({job: {}} | accepts(false) | not)
            ] | all and ($jobs | accepts($full))
          '

  required:
    name: required
    if: always()
    needs: [changes, hygiene, deny, machete, contract-lint, pr-title, xtask, engine-build-test, app, bench, fuzz, ci-required]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'length > 0 and all(.[]; . == "success" or . == "skipped")' <<< "${RESULTS}"

