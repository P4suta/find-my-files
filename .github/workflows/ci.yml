name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Label-only events belong to release-gate.yml. Keeping them out of this
    # workflow is a security invariant: a cheap label run must never replace a
    # failed ci-required result for the same commit with a skipped/green result.
    types: [opened, synchronize, reopened]

# Cancel superseded PR runs; never cancel main (post-merge lineage/artifacts).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0" # CI-only; does not touch local incremental (ADR-0014)
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Least privilege by default; the only job needing more (pr-title) sets its own.
permissions:
  contents: read

jobs:
  # Skip the heavy windows jobs on docs-only PRs (ci-required treats their
  # `skipped` as success, so branch protection still passes).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      fuzz: ${{ steps.f.outputs.fuzz }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            code:
              - 'engine/**'
              - 'app/**'
              - 'contract/**'
              - 'xtask/**'
              - 'mise.toml'
              - 'justfile'
              - 'lefthook.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.github/actions/**'
              # Workflow behavior is executable release/build logic. Keep this
              # future-proof instead of hand-maintaining an allowlist that can
              # silently omit a newly added gate.
              - '.github/workflows/**'
            # fmf-core is listed because its cfg-gate-free parsers are what the
            # fuzz targets build against. `ondisk` (the NTFS grammar) is now
            # reachable from Linux too (ADR-0047) but has no target yet, so this
            # filter is broader than the coverage it triggers — deliberately, so
            # a grammar change never merges without the existing targets running.
            fuzz:
              - 'engine/fuzz/**'
              - 'engine/crates/fmf-proto/**'
              - 'engine/crates/fmf-contract/**'
              - 'engine/crates/fmf-core/**'
              - '.github/workflows/fuzz.yml'
              - '.github/workflows/ci.yml'

  # ── ubuntu hygiene tier: parallel, no needs, cheap fast-fail signal ──
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Lint the workflow YAML itself: syntax, ${{ }} expression types, and
      # shellcheck over run: blocks. Catches workflow errors before a release run.
      - uses: ./.github/actions/setup-actionlint
        id: actionlint
      - run: '"$ACTIONLINT"'
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}
      # CI uses the ecosystem-standard checksummed release installer directly;
      # mise remains the local developer environment manager. The doctor checks
      # that both lanes pin the same tool versions.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: zizmor@1.28.0,typos-cli@1.47.2,taplo-cli@0.10.0
          fallback: none
      - name: Audit GitHub Actions security
        run: zizmor --offline --strict-collection --persona auditor --min-severity low .
      - name: Check spelling
        run: typos
      # fmt --check from the repo root enforces TOML *formatting* (taplo.toml),
      # not just validity, across every crate + the root configs.
      - run: taplo fmt --check
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: engine

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Prebuilt binary (cargo install from source took minutes); advisories
      # are owned by cargo-audit.yml, so this checks bans/licenses/sources.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.19.9
          fallback: none
      - run: cargo deny check bans licenses sources
        working-directory: engine

  machete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - run: cargo machete engine

  # A cheap Linux lint of the contract/proto layer. These are not the only
  # crates that build off-Windows: fmf-core's windows-sys dependency is
  # cfg-gated, so its pure parsers (ondisk / query / index::snapshot /
  # usn::records / wtf8) compile on Linux too — that is what the `fuzz` job
  # below exercises (ADR-0047). fmf-core is deliberately not linted here: the
  # Linux view of it is a strict subset of the Windows `engine-build-test`
  # clippy run, so adding it would only duplicate that gate.
  contract-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          shared-key: engine-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p fmf-contract -p fmf-proto --all-targets -- -D warnings
        working-directory: engine

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read # validate the PR title through the event's API object
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The xtask dev-tooling crate (build/release plumbing) is its own workspace of
  # pure, OS-agnostic logic, so it tests on cheap ubuntu. Always runs — xtask/
  # isn't in the `changes` filter and ci-required gates on it. Advisory scanning
  # lives in cargo-audit.yml alongside the engine's.
  xtask:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: xtask
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - run: cargo fmt --all --check
        working-directory: xtask
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: xtask
      - run: cargo nextest run --locked --profile ci
        working-directory: xtask
      - name: Upload xtask nextest JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtask-nextest-junit
          path: build/xtask/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

  # ── windows engine tier: engine compiles once here, the app reuses the dll ──
  engine-build-test:
    needs: [hygiene, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          shared-key: engine-win # shared with codeql/nightly to reuse deps
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
          fallback: none
      - name: clippy (compiles the engine; later steps reuse it)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: engine
      # Contract drift is gated by drift.rs inside the workspace test run below
      # (it runs `gen-contract --check` for EngineContract.g.cs), so no separate
      # codegen + git-diff step is needed here
      # (ADR-0018).
      - name: uninstrumented pipe page latency gate
        run: cargo nextest run --locked --workspace --profile ci-latency -E 'test(page_roundtrip_stays_inside_the_latency_budget)'
        working-directory: engine
      - name: test + line coverage gate
        # Measured 77.99% (just cov); gate held ~2pt below for tool/run headroom.
        # LLVM instrumentation invalidates the 5 ms wall-clock pipe budget; the
        # uninstrumented step above owns it.
        run: |
          mkdir -p ../build/coverage
          cargo llvm-cov nextest --locked --workspace --profile ci-coverage --fail-under-lines 76 --lcov --output-path ../build/coverage/engine-lcov.info -E 'not test(page_roundtrip_stays_inside_the_latency_budget)'
        working-directory: engine
      - name: Upload engine nextest JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-nextest-junit
          path: |
            build/engine/nextest/ci-latency/latency.xml
            build/engine/nextest/ci-coverage/coverage.xml
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: doctest
        run: cargo test --locked --workspace --exclude fmf-ffi --doc
        working-directory: engine
      - name: doc (warnings = errors)
        run: cargo doc --locked --workspace --no-deps
        working-directory: engine
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: build shipped engine dll + service + launcher (release)
        run: cargo build --locked --release -p fmf-ffi -p fmf-service -p fmf-launcher
        working-directory: engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-release
          path: |
            build/engine/release/fmf_engine.dll
            build/engine/release/fmf-service.exe
            build/engine/release/fmf-launcher.exe
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: build/coverage/engine-lcov.info
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  app:
    needs: [engine-build-test]
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Reuse the engine binaries built upstream. The publish recipes still run
      # the independent xtask workspace, so provision and cache Rust for xtask
      # without rebuilding the engine.
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: xtask
          shared-key: app-xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-release
          path: build/engine/release/
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302
      - uses: ./.github/actions/setup-winapp
        id: winapp
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          # just: the publish recipe. cargo-about: publish generates the bundle's
          # THIRD-PARTY-NOTICES.txt from the Rust crate graph.
          tool: just@1.54.0,cargo-about@0.7.1
          fallback: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # Publish (not bare `dotnet build`): only the publish output is a runnable
      # bundle — the WinUI component package wires WinRT.Runtime.dll, the native
      # helpers and compiled XAML in at publish time. Reuses the same xtask-owned
      # path as release.yml (including its locked-graph fetch for offline legal
      # notices); skip_rust=true since the engine dll/exe are prebuilt above.
      - name: publish app (SkipRustBuild — engine binaries are prebuilt)
        run: just publish-app true
      - name: shipping bundle startup smoke (no test seams)
        run: just ui-test-stable-smoke
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}
      - name: test app + coverage gate (line+branch, UI-excluded)
        run: just test-app-cov true
      - name: pipe integration (C# client × real service, unelevated)
        run: >-
          dotnet test app/FindMyFiles.Tests --settings app/FindMyFiles.Tests/pipe.runsettings
          --results-directory build/test-results/pipe
          -p:SkipRustBuild=true -p:RestoreLockedMode=true
      # Stable artifacts exclude fake/custom engine seams. Build the explicitly
      # marked, isolated UI-test bundle for deterministic full UI automation.
      - name: publish isolated UI-test bundle
        run: just publish-ui-test true
      - name: UI-test bundle automation
        run: just ui-test-published
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}
      - name: upload UI automation evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-automation-failure
          path: build/ui-automation/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      # The shipping bundle's runnability and absence of test seams are verified
      # by xtask; the separate UI-test bundle above is never uploaded here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: find-my-files-win-x64
          path: build/dist/FindMyFiles/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Required compile/run smoke on PRs. Hosted-runner timing is intentionally
  # not judged here (ADR-0013); the authoritative regression verdict is the
  # instrument-bound `just perf-gate`. A broken benchmark binary or crashing
  # benchmark is nevertheless a release-blocking defect.
  bench:
    needs: [hygiene, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          shared-key: engine-win
          save-if: false
      - run: cargo bench --locked -p fmf-core --features testutil
        working-directory: engine

  # Bounded libFuzzer smoke over the untrusted-input parsers, folded into the
  # required gate (#93: it used to be a separate non-required workflow, so
  # auto-merge could merge with fuzz red). Reuses the fuzz workflow definition
  # (single source) and runs only when the fuzzable surface changes; otherwise
  # skipped, which ci-required treats as success.
  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml

  # Single required status check. Transitively enforces the leaves and treats
  # `skipped` (docs-only / paths-gated) as success — avoids the "Expected —
  # Waiting" deadlock. PR-only: it gates PR merges, so there is nothing to gate
  # on a push to main — and a cancelled post-merge push run would otherwise make
  # gate-results (which counts `cancelled` as failure) paint main spuriously red.
  ci-required:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [hygiene, deny, machete, contract-lint, pr-title, xtask, engine-build-test, app, bench, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: gate on needed job results
        uses: ./.github/actions/gate-results
        with:
          results: ${{ join(needs.*.result, ',') }}
