name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read # Permission: Select checks from the changed PR files.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      assurance: ${{ steps.f.outputs.assurance }}
      comments: ${{ steps.f.outputs.comments }}
      fuzz: ${{ steps.f.outputs.fuzz_all == 'true' || steps.f.outputs.fuzz_wire == 'true' || steps.f.outputs.fuzz_core == 'true' || steps.f.outputs.fuzz_usn == 'true' || steps.f.outputs.fuzz_ntfs == 'true' }}
      fuzz_surfaces: ${{ steps.f.outputs.changes }}
      bench: ${{ steps.f.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            assurance:
              - 'engine/Cargo.*'
              - 'engine/.cargo/**'
              - 'engine/crates/fmf-contract/**'
              - 'engine/crates/fmf-core/**'
              - 'engine/crates/fmf-runtime/**'
              - 'engine/crates/fmf-proto/**'
              - 'xtask/**'
              - 'verification/**'
              - 'mise.toml'
              - '.github/actions/rust-toolchain/**'
              - '.github/workflows/ci.yml'
            comments:
              - 'engine/**'
              - 'app/**'
              - 'xtask/**'
              - '.github/**'
              - 'mise.toml'
              - 'lefthook.yml'
              - 'renovate.local.json5'
              - '.ocomment.toml'
            code:
              - 'engine/**'
              - 'app/**'
              - 'contract/**'
              - 'xtask/**'
              - 'mise.toml'
              - 'justfile'
              - 'lefthook.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.github/actions/**'
              # Workflow behavior is executable release/build logic. Keep this
              # future-proof instead of hand-maintaining an allowlist that can
              # silently omit a newly added gate.
              - '.github/workflows/**'
            fuzz_all:
              - 'engine/fuzz/**'
              - 'xtask/src/strict_json.rs'
              - 'xtask/src/interpreter.rs'
              - 'xtask/src/paths.rs'
              - 'xtask/src/cmd.rs'
              - 'xtask/src/main.rs'
              - 'xtask/Cargo.toml'
              - 'xtask/Cargo.lock'
              - 'verification/fuzz/**'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'engine/.cargo/**'
              - 'engine/crates/fmf-core/Cargo.toml'
              - 'engine/crates/fmf-runtime/Cargo.toml'
              - 'engine/crates/fmf-core/build.rs'
              - 'engine/crates/fmf-runtime/build.rs'
              - 'engine/crates/fmf-core/src/lib.rs'
              - 'engine/crates/fmf-runtime/src/lib.rs'
              - 'engine/crates/fmf-runtime/src/metrics.rs'
              - 'engine/crates/fmf-runtime/src/diag/**'
              - 'engine/crates/fmf-proto/Cargo.toml'
              - 'engine/crates/fmf-proto/build.rs'
              - 'engine/crates/fmf-contract/**'
              - 'mise.toml'
              - '.github/actions/rust-toolchain/**'
              - '.github/actions/fuzz-target/**'
              - '.github/workflows/fuzz.yml'
              - '.github/workflows/ci.yml'
            fuzz_wire:
              - 'engine/crates/fmf-proto/**'
            fuzz_core:
              - 'engine/crates/fmf-runtime/src/query/**'
              - 'engine/crates/fmf-runtime/src/index/**'
              - 'engine/crates/fmf-core/src/wtf8.rs'
              - 'engine/crates/fmf-runtime/src/wtf8.rs'
            fuzz_usn:
              - 'engine/crates/fmf-core/src/usn/**'
              - 'engine/crates/fmf-runtime/src/usn/**'
            fuzz_ntfs:
              - 'engine/crates/fmf-core/src/ondisk/**'
              - 'engine/crates/fmf-runtime/src/ondisk/**'
            bench:
              - 'engine/crates/fmf-core/**'
              - 'engine/crates/fmf-runtime/**'
              - 'engine/benches/**'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'mise.toml'
              - '.github/actions/rust-toolchain/**'
              - '.github/workflows/ci.yml'

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck over run: blocks. Catches workflow errors before a release run.
      - uses: $/.github/actions/setup-actionlint
        id: actionlint
      - run: '"$ACTIONLINT"'
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: zizmor@1.30.1,typos-cli@1.47.2,taplo-cli@0.10.0
          fallback: none
      - name: Audit GitHub Actions security
        run: zizmor --offline --strict-collection --persona auditor --min-severity low .
      - name: Check spelling
        run: typos
      - run: taplo fmt --check
      - uses: $/.github/actions/rust-toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: engine
      - run: cargo fmt --all --check
        working-directory: engine/fuzz

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check bans licenses sources
        working-directory: engine

  machete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - run: cargo machete engine

  contract-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          shared-key: engine-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p fmf-contract -p fmf-proto --all-targets -- -D warnings
        working-directory: engine

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read # Permission: Validate the PR title through the API.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  xtask:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: xtask
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - run: cargo fmt --all --check
        working-directory: xtask
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: xtask
      - run: cargo nextest run --locked --profile ci
        working-directory: xtask
      - name: Install the source-pinned comment checker
        if: needs.changes.outputs.comments == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- verification-tools comments
      - name: Check source comments
        if: needs.changes.outputs.comments == 'true'
        run: ocomment check --jobs 2 --format github engine app xtask .github mise.toml lefthook.yml renovate.local.json5
      - name: Install the checksum-verified prover
        if: needs.changes.outputs.assurance == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- verification-tools kani
      - name: Verify the registered production harnesses
        if: needs.changes.outputs.assurance == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- proof
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: needs.changes.outputs.assurance == 'true'
        with:
          toolchain: nightly-2026-08-21
          components: miri, rust-src
      - name: Interpret the codec boundary tests
        if: needs.changes.outputs.assurance == 'true'
        run: cargo run --locked --manifest-path xtask/Cargo.toml --target-dir build/xtask -- miri
      - name: Upload proof evidence
        if: always() && needs.changes.outputs.assurance == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-proofs
          path: build/verification/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload xtask nextest JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask-nextest-junit
          path: build/xtask/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

  engine-build-test:
    needs: [hygiene, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          shared-key: engine-win
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
          fallback: none
      - name: clippy (compiles the engine; later steps reuse it)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: engine
      - name: uninstrumented pipe page latency gate
        run: cargo nextest run --locked --workspace --profile ci-latency -E 'test(page_roundtrip_stays_inside_the_latency_budget)'
        working-directory: engine
      - name: test + line coverage gate
        run: |
          mkdir -p ../build/coverage
          cargo llvm-cov nextest --locked --workspace --profile ci-coverage --fail-under-lines 76 --lcov --output-path ../build/coverage/engine-lcov.info -E 'not test(page_roundtrip_stays_inside_the_latency_budget)'
        working-directory: engine
      - name: Upload engine nextest JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-nextest-junit
          path: |
            build/engine/nextest/ci-latency/latency.xml
            build/engine/nextest/ci-coverage/coverage.xml
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: doctest
        run: cargo test --locked --workspace --exclude fmf-ffi --doc
        working-directory: engine
      - name: doc (warnings = errors)
        run: cargo doc --locked --workspace --no-deps
        working-directory: engine
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: build shipped engine dll + service + launcher (release)
        run: cargo build --locked --release -p fmf-ffi -p fmf-service -p fmf-launcher
        working-directory: engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-release
          path: |
            build/engine/release/fmf_engine.dll
            build/engine/release/fmf-service.exe
            build/engine/release/fmf-launcher.exe
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: build/coverage/engine-lcov.info
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  app:
    needs: [engine-build-test]
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: xtask
          shared-key: app-xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-release
          path: build/engine/release/
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - uses: $/.github/actions/setup-winapp
        id: winapp
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@1.54.0,cargo-about@0.9.1
          fallback: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: publish app (SkipRustBuild — engine binaries are prebuilt)
        run: just publish-app true
      - name: shipping bundle startup smoke (no test seams)
        run: just ui-test-stable-smoke
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}
      - name: test app + coverage gate (line+branch, UI-excluded)
        run: just test-app-cov true
      - name: pipe integration (C# client × real service, unelevated)
        run: >-
          dotnet test app/FindMyFiles.Tests --settings app/FindMyFiles.Tests/pipe.runsettings
          --results-directory build/test-results/pipe
          -p:SkipRustBuild=true -p:RestoreLockedMode=true
      - name: publish isolated UI-test bundle
        run: just publish-ui-test true
      - name: UI-test bundle automation
        run: just ui-test-published
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}
      - name: upload UI automation evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-automation-failure
          path: build/ui-automation/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: find-my-files-win-x64
          path: build/dist/FindMyFiles/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  bench:
    needs: [hygiene, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.bench == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          shared-key: engine-win
          save-if: false
      - run: cargo bench --locked -p fmf-runtime --features testutil -- --test
        working-directory: engine

  fuzz:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/fuzz.yml
    with:
      surfaces: ${{ needs.changes.outputs.fuzz_surfaces }}

  ci-required:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [hygiene, deny, machete, contract-lint, pr-title, xtask, engine-build-test, app, bench, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gate on needed job results
        uses: $/.github/actions/gate-results
        with:
          results: ${{ join(needs.*.result, ',') }}

  required:
    name: required
    if: always()
    needs: [changes, hygiene, deny, machete, contract-lint, pr-title, xtask, engine-build-test, app, bench, fuzz, ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
