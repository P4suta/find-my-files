name: fuzz

on:
  workflow_call:
    inputs:
      surfaces:
        description: JSON array of changed parser surfaces from the CI path filter.
        type: string
        required: false
        default: '["fuzz_all"]'
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-24
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '10' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: nightly-2026-07-24
      - name: Install cargo-fuzz from its locked crates.io package
        run: cargo install cargo-fuzz --locked --version 0.13.2 --root "$RUNNER_TEMP/fmf-cargo-fuzz"
      - name: Expose the isolated cargo-fuzz subcommand
        run: echo "$RUNNER_TEMP/fmf-cargo-fuzz/bin" >> "$GITHUB_PATH"
      - name: Verify committed fuzz dependency graph
        working-directory: engine
        run: >-
          cargo metadata --locked --manifest-path fuzz/Cargo.toml
          --format-version 1 > /dev/null
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_wire')
        with:
          target: frame_decode
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_wire')
        with:
          target: message_decode
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_core')
        with:
          target: query_parse
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_core')
        with:
          target: index_snapshot
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_usn')
        with:
          target: usn_records
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_core')
        with:
          target: wtf8_decode
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_ntfs')
        with:
          target: ntfs_boot_sector
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_ntfs')
        with:
          target: ntfs_file_record
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_ntfs')
        with:
          target: ntfs_attribute_list
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all') || contains(fromJSON(inputs.surfaces), 'fuzz_ntfs')
        with:
          target: ntfs_extent_runs
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: $/.github/actions/fuzz-target
        if: contains(fromJSON(inputs.surfaces || '["fuzz_all"]'), 'fuzz_all')
        with:
          target: strict_json_decode
          seconds: ${{ env.FUZZ_SECONDS }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: build/verification/fuzz-artifacts/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
