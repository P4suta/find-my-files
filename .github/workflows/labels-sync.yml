name: labels-sync

on:
  push:
    branches: [main]
    paths: [".github/labels.json"]
  workflow_dispatch:

concurrency:
  group: labels-sync-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # Permission: Create and update repository labels.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync labels from manifest (additive; never deletes)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -c '.[]' .github/labels.json | while IFS= read -r row; do
            name=$(jq -r '.name' <<<"$row")
            color=$(jq -r '.color' <<<"$row")
            # GitHub caps label descriptions at 100 chars; truncate defensively.
            desc=$(jq -r '.description' <<<"$row")
            desc=${desc:0:100}
            echo "syncing: $name"
            gh label create "$name" --color "$color" --description "$desc" --force
          done
