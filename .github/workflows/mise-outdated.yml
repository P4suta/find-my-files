name: mise-outdated

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mise-outdated
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "v2026.11.2"
          sha256: 490326d33fcde0686f1280f69b9b021e1842ee2bbd71249c1ebadc2a0efad26b
          install: false

      - name: Check pins against latest (beyond-pin)
        id: check
        shell: bash
        run: |
          # --bump: latest beyond the pin. --local: only this repo's mise.toml,
          # never the global config. Exits 0 even when updates exist.
          mise outdated --bump --local --json > outdated.json || true
          echo "Raw mise outdated --bump --local:"; cat outdated.json
          # Keep only tools whose pin itself is behind (bump != null); a
          # within-pin patch has bump == null and is not a drift.
          drift=$(jq '[to_entries[] | select(.value.bump != null)] | length' outdated.json)
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          {
            echo "| Tool | Pinned | Latest |"
            echo "|---|---|---|"
            jq -r 'to_entries[] | select(.value.bump != null)
                   | "| `\(.key)` | \(.value.requested) | \(.value.bump) |"' outdated.json
          } > drift-table.md
          echo "Tools whose pin is behind: $drift"

      - name: Hand the bounded drift report to the issue writer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-outdated-report
          path: drift-table.md
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  report:
    name: report
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # Permission: Download the bounded dependency report.
      issues: write # Permission: Maintain the dependency freshness issue.
    env:
      TRACKING_ISSUE_QUERY: 'if length >= 100 then error("toolchain issue listing may be truncated") else map(select(.title == "mise toolchain pins are behind latest" and .author.is_bot == true and .author.login == "app/github-actions")) | if length > 1 then error("duplicate toolchain tracking issues") else .[0].number // empty end end'
    steps:
      - name: Verify tracking issue ownership
        shell: bash
        run: |
          set -euo pipefail
          candidates='[
            {"number":2,"title":"Unrelated issue","author":{"login":"owner","is_bot":false}},
            {"number":3,"title":"mise toolchain pins are behind latest","author":{"login":"owner","is_bot":false}},
            {"number":4,"title":"mise toolchain pins are behind latest","author":{"login":"app/renovate","is_bot":true}},
            {"number":5,"title":"Another workflow issue","author":{"login":"app/github-actions","is_bot":true}},
            {"number":7,"title":"mise toolchain pins are behind latest","author":{"login":"app/github-actions","is_bot":false}},
            {"number":8,"title":"mise toolchain pins are behind latest","author":null},
            {"number":1,"title":"mise toolchain pins are behind latest","author":{"login":"app/github-actions","is_bot":true}}
          ]'
          selected=$(printf '%s\n' "$candidates" | jq -r "$TRACKING_ISSUE_QUERY")
          if [ "$selected" != 1 ]; then
            echo 'Issue selection must reject unrelated authors and titles.' >&2
            exit 1
          fi
          unrelated=$(printf '%s\n' "$candidates" | jq 'map(select(.number != 1))')
          if [ -n "$(printf '%s\n' "$unrelated" | jq -r "$TRACKING_ISSUE_QUERY")" ]; then
            echo 'Issue selection must return no target when the tracker is absent.' >&2
            exit 1
          fi
          duplicates=$(printf '%s\n' "$candidates" | jq '[.[] | select(.number == 1)] | . + [.[0] | .number = 6]')
          if printf '%s\n' "$duplicates" | jq -r "$TRACKING_ISSUE_QUERY" >/dev/null 2>&1; then
            echo 'Issue selection must reject duplicate owned trackers.' >&2
            exit 1
          fi
          truncated=$(jq -cn '[range(0;100) | {number:.,title:"Unrelated issue",author:{login:"owner",is_bot:false}}]')
          if printf '%s\n' "$truncated" | jq -r "$TRACKING_ISSUE_QUERY" >/dev/null 2>&1; then
            echo 'Issue selection must reject a potentially incomplete listing.' >&2
            exit 1
          fi
          echo 'Tracking issue ownership and ambiguity checks passed.'

      - name: Download the bounded drift report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mise-outdated-report

      - name: Open / update / close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ needs.check.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label mise-outdated --state open --limit 100 --json number,title,author --jq "$TRACKING_ISSUE_QUERY")
          gh label create mise-outdated --color FBCA04 --force \
            --description "A mise.toml toolchain pin has fallen behind its latest version (mise-outdated.yml)"

          if [ "$DRIFT" -gt 0 ]; then
            {
              echo "## 🧰 mise toolchain pins are behind"
              echo
              echo "\`mise outdated --bump\` found pins in \`mise.toml\` whose latest version is **beyond the current pin** — Dependabot doesn't watch the mise ecosystem, so these need a manual bump."
              echo
              cat drift-table.md
              echo
              echo "- Detection run: $RUN_URL"
              echo "- Fix: bump the pin in \`mise.toml\`, update every mirrored official setup Action / \`taiki-e/install-action\` input reported by \`just doctor\`, run \`mise install\`, then verify the affected gate (\`just deny\` / \`just cov\` / \`just doc\` / …)."
            } > issue-body.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue-body.md
              echo "Updated issue #$existing."
            else
              gh issue create --title "mise toolchain pins are behind latest" \
                --label mise-outdated --body-file issue-body.md
            fi
          else
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "All mise.toml pins are current as of $RUN_URL. Closing."
              gh issue close "$existing"
            fi
            echo "All mise.toml pins are current."
          fi
