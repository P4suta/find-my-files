name: mise-outdated

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mise-outdated
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "v2026.10.21"
          sha256: 490934f990e130c2d3ec8e192c9bd06004168659ffcd28ea4e27ba489fade89e
          install: false

      - name: Check pins against latest (beyond-pin)
        id: check
        shell: bash
        run: |
          # --bump: latest beyond the pin. --local: only this repo's mise.toml,
          # never the global config. Exits 0 even when updates exist.
          mise outdated --bump --local --json > outdated.json || true
          echo "Raw mise outdated --bump --local:"; cat outdated.json
          # Keep only tools whose pin itself is behind (bump != null); a
          # within-pin patch has bump == null and is not a drift.
          drift=$(jq '[to_entries[] | select(.value.bump != null)] | length' outdated.json)
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          {
            echo "| Tool | Pinned | Latest |"
            echo "|---|---|---|"
            jq -r 'to_entries[] | select(.value.bump != null)
                   | "| `\(.key)` | \(.value.requested) | \(.value.bump) |"' outdated.json
          } > drift-table.md
          echo "Tools whose pin is behind: $drift"

      - name: Hand the bounded drift report to the issue writer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-outdated-report
          path: drift-table.md
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  report:
    name: report
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # Permission: Download the bounded dependency report.
      issues: write # Permission: Maintain the dependency freshness issue.
    steps:
      - name: Download the bounded drift report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mise-outdated-report

      - name: Open / update / close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ needs.check.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create mise-outdated --color FBCA04 --force \
            --description "A mise.toml toolchain pin has fallen behind its latest version (mise-outdated.yml)"
          existing=$(gh issue list --label mise-outdated --state open --json number --jq '.[0].number // empty')

          if [ "$DRIFT" -gt 0 ]; then
            {
              echo "## 🧰 mise toolchain pins are behind"
              echo
              echo "\`mise outdated --bump\` found pins in \`mise.toml\` whose latest version is **beyond the current pin** — Dependabot doesn't watch the mise ecosystem, so these need a manual bump."
              echo
              cat drift-table.md
              echo
              echo "- Detection run: $RUN_URL"
              echo "- Fix: bump the pin in \`mise.toml\`, update every mirrored official setup Action / \`taiki-e/install-action\` input reported by \`just doctor\`, run \`mise install\`, then verify the affected gate (\`just deny\` / \`just cov\` / \`just doc\` / …)."
            } > issue-body.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue-body.md
              echo "Updated issue #$existing."
            else
              gh issue create --title "mise toolchain pins are behind latest" \
                --label mise-outdated --body-file issue-body.md
            fi
          else
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "All mise.toml pins are current as of $RUN_URL. Closing."
              gh issue close "$existing"
            fi
            echo "All mise.toml pins are current."
          fi
