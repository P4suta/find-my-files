name: nightly-admin

on:
  schedule:
    - cron: "17 17 * * 1"
  workflow_dispatch:

concurrency:
  group: nightly-admin-${{ github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admin-tests:
    name: admin-tests
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,just@1.59.0
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine-win
      - name: elevated real-volume and machine-security suite
        run: just test-admin
      - name: Upload nextest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-admin-nextest
          path: build/engine/nextest/admin/admin.xml
          retention-days: 14
          if-no-files-found: error
          overwrite: true
