
name: nightly

on:
  schedule:
    - cron: "47 16 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      built: ${{ steps.freshness.outputs.build }}
      date: ${{ steps.identity.outputs.date }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to build
        id: freshness
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' --format=%H -n 1)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No commits to main in the last 24h — skipping nightly."
          fi

      - uses: $/.github/actions/rust-toolchain
        if: steps.freshness.outputs.build == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.freshness.outputs.build == 'true'
        with:
          dotnet-version: 10.0.403
      - uses: $/.github/actions/setup-winapp
        id: winapp
        if: steps.freshness.outputs.build == 'true'
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.freshness.outputs.build == 'true'
        with:
          tool: just@1.59.0,cargo-about@0.9.3
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.freshness.outputs.build == 'true'
        with:
          workspaces: engine
          shared-key: engine-win
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.freshness.outputs.build == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve nightly build version
        if: steps.freshness.outputs.build == 'true'
        id: identity
        shell: bash
        run: |
          DATE=$(date -u +%Y%m%d)
          VER=$(just version --channel nightly --date "$DATE")
          {
            echo "FMF_BUILD_VERSION=$VER"
            echo "FmfChannel=nightly.$DATE"
            echo "NIGHTLY_DATE=$DATE"
          } >> "$GITHUB_ENV"
          {
            echo "date=$DATE"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Building nightly $VER"

      - name: Build distributable bundle (unsigned)
        if: steps.freshness.outputs.build == 'true'
        run: just publish

      - name: Shipping bundle startup smoke (no test seams)
        if: steps.freshness.outputs.build == 'true'
        run: just ui-test-stable-smoke
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}

      - name: Build isolated UI-test bundle
        if: steps.freshness.outputs.build == 'true'
        run: just publish-ui-test true

      - name: UI-test bundle automation
        if: steps.freshness.outputs.build == 'true'
        run: just ui-test-published
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}

      - name: Upload UI automation evidence on failure
        if: ${{ failure() && steps.freshness.outputs.build == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-ui-automation-failure
          path: build/ui-automation/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Generate SBOMs and scan (gate)
        if: steps.freshness.outputs.build == 'true'
        uses: $/.github/actions/sbom-scan

      - name: Package (tagless — zip name from bundled BUILDINFO)
        if: steps.freshness.outputs.build == 'true'
        run: just package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.freshness.outputs.build == 'true'
        with:
          name: find-my-files-nightly-${{ env.NIGHTLY_DATE }}
          path: |
            build/package/find-my-files-${{ steps.identity.outputs.version }}-win-x64.zip
            build/package/SHA256SUMS.txt
            build/sbom/fmf-engine.cdx.json
            build/sbom/app.cdx.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  attest:
    name: attest
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # Permission: Download the completed nightly package.
      contents: read
      id-token: write # Permission: Authenticate keyless artifact attestation.
      attestations: write # Permission: Publish the nightly package attestation.
    steps:
      - name: Download completed nightly artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: find-my-files-nightly-${{ needs.build.outputs.date }}
          path: build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/package/find-my-files-${{ needs.build.outputs.version }}-win-x64.zip
            build/package/SHA256SUMS.txt

      - name: Attest Rust SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/package/find-my-files-${{ needs.build.outputs.version }}-win-x64.zip
          sbom-path: build/sbom/fmf-engine.cdx.json

      - name: Attest C# SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/package/find-my-files-${{ needs.build.outputs.version }}-win-x64.zip
          sbom-path: build/sbom/app.cdx.json
