# Nightly builds (ADR-0035): an unsigned distributable from the tip of main,
# stamped `X.Y.Z-nightly.<date>+g<sha>` so it can never be mistaken for a stable
# release. Published as a 14-day GitHub Actions artifact (NOT a Release) — that
# keeps it off the Releases list and sidesteps Immutable Releases (no rolling
# tag to overwrite). Grab the latest with:
#   gh run download --repo P4suta/find-my-files -n find-my-files-nightly-<date>
# Nightlies are deliberately UNSIGNED (testers accept the SmartScreen warning);
# the approval-gated signing pipeline is stable-only. But they DO carry the rest
# of the supply chain (ADR-0040): CycloneDX SBOMs, an osv-scanner gate, and
# keyless build-provenance + SBOM attestations — so a nightly is verifiable with
# `gh attestation verify`, same as a release minus the Authenticode signature.
# See docs/RELEASING.md and ADR-0040.

name: nightly

on:
  schedule:
    - cron: "47 16 * * *" # 01:47 JST — offset from the Monday security cluster + nightly-admin (17:17)
  workflow_dispatch:

# Serialize nightlies and never cancel after artifact creation: an uploaded
# artifact must not be stranded half-attested.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # workflow_dispatch lets callers choose a ref. Nightly provenance must never
    # bless a feature branch under the repository's official nightly identity.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      built: ${{ steps.freshness.outputs.build }}
      date: ${{ steps.identity.outputs.date }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      # The job-level ref guard makes manual feature-branch runs inert. Keep the
      # default event SHA here so the built bytes and provenance cannot drift if
      # main advances after the workflow starts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Don't rebuild an identical nightly: skip the scheduled run when main has
      # not moved in the last 24h (HEAD's own date is the signal — depth-1 is
      # enough). Manual dispatch always builds.
      - name: Decide whether to build
        id: freshness
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' --format=%H -n 1)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No commits to main in the last 24h — skipping nightly."
          fi

      # CI provisions only the tools this job executes. Rust reads the repository
      # pin, .NET uses its first-party Action, and WinAppCli is byte/signer pinned
      # by the repository-local security boundary.
      - uses: ./.github/actions/rust-toolchain
        if: steps.freshness.outputs.build == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.freshness.outputs.build == 'true'
        with:
          dotnet-version: 10.0.302
      - uses: ./.github/actions/setup-winapp
        id: winapp
        if: steps.freshness.outputs.build == 'true'
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        if: steps.freshness.outputs.build == 'true'
        with:
          tool: just@1.54.0,cargo-about@0.9.1
          fallback: none
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.freshness.outputs.build == 'true'
        with:
          workspaces: engine
          shared-key: engine-win # reuse the deps cache CI warms on main
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.freshness.outputs.build == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Stamp the build as a nightly: FMF_BUILD_VERSION (Rust build.rs) +
      # FmfChannel (C# csproj, read by MSBuild as a property). The canonical
      # format comes from one place — `xtask version`.
      - name: Resolve nightly build version
        if: steps.freshness.outputs.build == 'true'
        id: identity
        shell: bash
        run: |
          DATE=$(date -u +%Y%m%d)
          VER=$(just version --channel nightly --date "$DATE")
          {
            echo "FMF_BUILD_VERSION=$VER"
            echo "FmfChannel=nightly.$DATE"
            echo "NIGHTLY_DATE=$DATE"
          } >> "$GITHUB_ENV"
          {
            echo "date=$DATE"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Building nightly $VER"

      - name: Build distributable bundle (unsigned)
        if: steps.freshness.outputs.build == 'true'
        run: just publish

      - name: Shipping bundle startup smoke (no test seams)
        if: steps.freshness.outputs.build == 'true'
        run: just ui-test-stable-smoke
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}

      - name: Build isolated UI-test bundle
        if: steps.freshness.outputs.build == 'true'
        run: just publish-ui-test true

      - name: UI-test bundle automation
        if: steps.freshness.outputs.build == 'true'
        run: just ui-test-published
        env:
          FMF_UI_CLI: ${{ steps.winapp.outputs.cli-path }}

      - name: Upload UI automation evidence on failure
        if: ${{ failure() && steps.freshness.outputs.build == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-ui-automation-failure
          path: build/ui-automation/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # Same supply-chain artefacts as a release, minus signing (ADR-0040): the
      # CycloneDX SBOMs + the osv-scanner gate, shared with release.yml via the
      # composite action so the tool versions never drift.
      - name: Generate SBOMs and scan (gate)
        if: steps.freshness.outputs.build == 'true'
        uses: ./.github/actions/sbom-scan

      - name: Package (tagless — zip name from bundled BUILDINFO)
        if: steps.freshness.outputs.build == 'true'
        run: just package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.freshness.outputs.build == 'true'
        with:
          # Date in the artifact name so the downloaded wrapper itself says which
          # nightly it is (the inner zip already carries the full version string).
          name: find-my-files-nightly-${{ env.NIGHTLY_DATE }}
          path: |
            build/package/find-my-files-${{ steps.identity.outputs.version }}-win-x64.zip
            build/package/SHA256SUMS.txt
            build/sbom/fmf-engine.cdx.json
            build/sbom/app.cdx.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  # Keep OIDC + attestation writes away from repository build/test code. This
  # job receives only the completed, immutable Actions artifact.
  attest:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # download the completed nightly package artifact
      contents: read
      id-token: write # exchange OIDC identity for the artifact attestation
      attestations: write # publish the nightly package attestation
    steps:
      - name: Download completed nightly artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: find-my-files-nightly-${{ needs.build.outputs.date }}
          path: build

      # Keyless build-provenance + SBOM attestations (Sigstore via OIDC, no
      # stored secrets) make the nightly `gh attestation verify`-able. The
      # 14-day artifact expires but attestations persist in the repository.
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            build/package/find-my-files-${{ needs.build.outputs.version }}-win-x64.zip
            build/package/SHA256SUMS.txt

      - name: Attest Rust SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: build/package/find-my-files-${{ needs.build.outputs.version }}-win-x64.zip
          sbom-path: build/sbom/fmf-engine.cdx.json

      - name: Attest C# SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: build/package/find-my-files-${{ needs.build.outputs.version }}-win-x64.zip
          sbom-path: build/sbom/app.cdx.json
