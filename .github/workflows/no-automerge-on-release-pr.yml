name: no-automerge-on-release-pr

on: # zizmor: ignore[dangerous-triggers] Trusted base workflow; API-only guard requires the exact same-repository release branch.
  pull_request_target:
    types: [auto_merge_enabled]

concurrency:
  group: no-automerge-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  disable:
    if: >-
      github.event.pull_request.base.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'release-please--branches--main--components--find-my-files'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # Permission: Disable auto-merge on the guarded release PR.
    steps:
      - name: Disable auto-merge on the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --disable-auto-merge
          gh pr comment "$PR" --repo "$REPO" --body \
            "🔒 Auto-merge was disabled automatically: a release is a deliberate act. Add the \`release: approved\` label and merge this PR by hand (ADR-0035)."
