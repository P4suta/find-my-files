name: Deploy GitHub Pages

# Publishes the landing page plus the canonical design book:
#   /        — landing page (site/index.html, ja/en)
#   /book/   — mdBook design docs rendered from docs/ (ADRs, security, research)
# Requires Settings > Pages > Source = "GitHub Actions" (set once after publish).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "xtask/**"
      - "mise.toml"
      - "justfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: read-only at the top level; the deploy job requests the
# Pages + OIDC writes it needs (Scorecard's Token-Permissions check rewards
# job-scoped writes over top-level ones).
permissions:
  contents: read

# One concurrent deploy; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
      # Install only the two release-archive binaries this job executes.
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: just@1.54.0,mdbook@0.5.3
          fallback: none
      - name: Build mdBook design docs (docs/ -> build/docs-book)
        run: mdbook build docs

      - name: Assemble site (landing + canonical book)
        run: just docs-assemble

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  # Keep Pages write authority and OIDC away from repository build code. This
  # runner receives only upload-pages-artifact's completed static-site archive
  # and executes pinned official Pages actions.
  deploy:
    needs: build
    permissions:
      pages: write # deploy the verified Pages artifact
      id-token: write # authenticate the deployment to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
