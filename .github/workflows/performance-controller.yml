name: performance-controller
run-name: ${{ github.event.workflow_run.display_title }}

# workflow_run always loads this controller from the default branch. The
# workflow_dispatch request is hosted-only, so no branch-supplied workflow can
# create or rewrite a self-hosted job. This controller refetches and revalidates
# the complete request identity before assigning the measurement instrument.
on: # zizmor: ignore[dangerous-triggers] trusted-controller split; checkout is immutable and post-authorization
  workflow_run:
    workflows: [performance-gate-request, performance-baseline-request]
    types: [completed]

permissions: {}

# Real-volume and Criterion measurements share one physical instrument. Baseline
# recording uses this same key, preventing either operation from contaminating
# the other's idle/clock measurements.
#
# External provisioner contract (ADR-0013): after `authorize` succeeds, mint a
# GitHub JIT configuration for exactly its runner_name/runner_label, configure
# the agent with `--ephemeral`, and register it only after rolling the OS/workspace
# disk back to the approved pre-job image. Attach the separately ACL-protected
# P: baseline volume after rollback. Never register a persistent runner with
# `fmf-jit-ephemeral`; without both that static label and this run/attempt label,
# a standing runner is not queue-eligible.
concurrency:
  group: fmf-performance-instrument
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # bind the controller to the exact completed request run
      contents: read # inspect protected refs, release drafts, and target blobs
    outputs:
      mode: ${{ steps.identity.outputs.mode }}
      tag_name: ${{ steps.identity.outputs.tag_name }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      release_id: ${{ steps.identity.outputs.release_id }}
      runner_label: ${{ steps.identity.outputs.runner_label }}
      runner_name: ${{ steps.identity.outputs.runner_name }}
    steps:
      - name: Bind the trusted request, tag, and draft
        id: identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          CONTROLLER_RUN_ID: ${{ github.run_id }}
          CONTROLLER_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sourceRunIdText = process.env.SOURCE_RUN_ID;
            const sourceHeadSha = process.env.SOURCE_HEAD_SHA;
            const repository = process.env.REPO;
            const controllerRunId = process.env.CONTROLLER_RUN_ID;
            const controllerRunAttempt = process.env.CONTROLLER_RUN_ATTEMPT;
            if (!/^[0-9]+$/.test(sourceRunIdText)) {
              throw new Error(`Invalid source run id '${sourceRunIdText}'.`);
            }
            if (!/^[0-9a-f]{40}$/.test(sourceHeadSha)) {
              throw new Error(`Invalid source head SHA '${sourceHeadSha}'.`);
            }
            if (
              !/^[1-9][0-9]*$/.test(controllerRunId) ||
              !/^[1-9][0-9]*$/.test(controllerRunAttempt)
            ) {
              throw new Error("Controller run/attempt identity is invalid.");
            }
            const parts = repository.split("/");
            if (parts.length !== 2 || parts.some((part) => part.length === 0)) {
              throw new Error(`Invalid repository identity '${repository}'.`);
            }
            const [owner, repo] = parts;
            const run_id = Number(sourceRunIdText);
            const { data: repositoryRecord } = await github.rest.repos.get({ owner, repo });
            if (repositoryRecord.owner?.type !== "Organization") {
              throw new Error(
                "Performance instrumentation requires an organization-owned repository " +
                  "with the restricted fmf-performance runner group.",
              );
            }

            const [
              { data: sourceRun },
              { data: gateWorkflow },
              { data: baselineWorkflow },
            ] = await Promise.all([
              github.rest.actions.getWorkflowRun({ owner, repo, run_id }),
              github.rest.actions.getWorkflow({
                owner,
                repo,
                workflow_id: "performance-gate-request.yml",
              }),
              github.rest.actions.getWorkflow({
                owner,
                repo,
                workflow_id: "performance-baseline-request.yml",
              }),
            ]);
            const mode =
              sourceRun.workflow_id === gateWorkflow.id
                ? "gate"
                : sourceRun.workflow_id === baselineWorkflow.id
                  ? "baseline"
                  : null;
            if (
              mode === null ||
              sourceRun.repository?.full_name !== repository ||
              sourceRun.event !== "workflow_dispatch" ||
              sourceRun.status !== "completed" ||
              sourceRun.conclusion !== "success" ||
              sourceRun.head_branch !== "main" ||
              String(sourceRun.head_sha).toLowerCase() !== sourceHeadSha
            ) {
              throw new Error("Performance request identity is not trustworthy.");
            }
            const runnerLabel =
              `fmf-jit-run-${controllerRunId}-attempt-${controllerRunAttempt}`;
            const runnerName = `fmf-perf-jit-${controllerRunId}-${controllerRunAttempt}`;
            core.setOutput("runner_label", runnerLabel);
            core.setOutput("runner_name", runnerName);

            const title = String(sourceRun.display_title ?? "");
            const { data: requestComparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${sourceHeadSha}...main`,
              });
            if (
              requestComparison.status !== "ahead" &&
              requestComparison.status !== "identical"
            ) {
              throw new Error(
                `Request controller ${sourceHeadSha} is not on main's protected lineage ` +
                  `(compare status: ${requestComparison.status}).`,
              );
            }

            if (mode === "baseline") {
              const baselineMatch =
                /^performance-baseline-request ([0-9a-f]{40})$/.exec(title);
              if (baselineMatch === null || baselineMatch[1] !== sourceHeadSha) {
                throw new Error(
                  `Baseline request title '${title}' is not bound to ${sourceHeadSha}.`,
                );
              }
              core.setOutput("mode", "baseline");
              core.setOutput("tag_name", "");
              core.setOutput("commit_sha", sourceHeadSha);
              core.setOutput("release_id", "");
              core.info(`Authorized baseline recording at ${sourceHeadSha}.`);
              return;
            }

            const match =
              /^performance-gate (v[0-9]+\.[0-9]+\.[0-9]+) ([0-9a-f]{40}) release ([1-9][0-9]*)$/.exec(title);
            if (match === null) {
              throw new Error(`Performance gate title '${title}' is not commit-bound.`);
            }
            const [, tag, requestedSha, releaseIdText] = match;
            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: tag,
            });
            const tagSha = String(commit.sha).toLowerCase();
            if (tagSha !== requestedSha) {
              throw new Error(`Tag ${tag} resolves to ${tagSha}, not requested ${requestedSha}.`);
            }
            const { data: measurementComparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${tagSha}...main`,
              });
            if (
              measurementComparison.status !== "ahead" &&
              measurementComparison.status !== "identical"
            ) {
              throw new Error(
                `${tag} is not on main's protected lineage ` +
                  `(compare status: ${measurementComparison.status}).`,
              );
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: Number(releaseIdText),
            });
            if (
              String(release.id) !== releaseIdText ||
              release.draft !== true ||
              release.prerelease !== false ||
              release.tag_name !== tag ||
              release.name !== tag
            ) {
              throw new Error(`Release ${releaseIdText} is not the exact ${tag} draft.`);
            }
            const targetSha = String(release.target_commitish ?? "").toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(targetSha) || targetSha !== tagSha) {
              throw new Error(
                `Draft target '${targetSha}' must be the exact tag commit ${tagSha}.`,
              );
            }

            core.setOutput("mode", "gate");
            core.setOutput("tag_name", tag);
            core.setOutput("commit_sha", tagSha);
            core.setOutput("release_id", releaseIdText);
            core.info(
              `Authorized release ${releaseIdText}, ${tag} at ${tagSha} from request run ${run_id}.`,
            );

  gate:
    needs: authorize
    if: ${{ needs.authorize.outputs.mode == 'gate' }}
    name: performance-gate-instrument
    # This environment has no secrets, requires a human reviewer, disallows admin
    # bypass, and permits protected main only. It is the second boundary after the
    # default-branch workflow_run controller.
    environment: performance
    runs-on: # zizmor: ignore[self-hosted-runner] restricted organization runner group
      group: fmf-performance
      labels:
        - Windows
        - X64
        - fmf-perf
        - fmf-jit-ephemeral
        - ${{ needs.authorize.outputs.runner_label }}
    timeout-minutes: 120
    permissions:
      actions: read # bind this process to its exact in-progress JIT job
      contents: read # check out only the pre-authorized target commit
    steps:
      - name: Fail closed unless this job is in the restricted runner group
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_JOB: performance-gate-instrument
          EXPECTED_RUNNER_NAME: ${{ needs.authorize.outputs.runner_name }}
          EXPECTED_RUNNER_LABEL: ${{ needs.authorize.outputs.runner_label }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $pages = gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp `
            "repos/$env:REPO/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" |
            ConvertFrom-Json -Depth 20
          $jobs = @($pages | ForEach-Object { $_.jobs })
          $matches = @(
            $jobs | Where-Object {
              $_.name -ceq $env:EXPECTED_JOB -and
              $_.runner_name -ceq $env:EXPECTED_RUNNER_NAME -and
              $_.status -ceq "in_progress"
            }
          )
          if ($matches.Count -ne 1) {
            throw "Could not bind this process to one in-progress Actions job."
          }
          $job = $matches[0]
          if ($job.runner_group_name -cne "fmf-performance" -or
              [int64]$job.runner_group_id -le 0) {
            throw "Job is not executing in the fmf-performance runner group."
          }
          if ($env:RUNNER_NAME -cne $env:EXPECTED_RUNNER_NAME) {
            throw "RUNNER_NAME '$env:RUNNER_NAME' is not the authorized one-time runner."
          }
          $expectedLabels = @(
            "Windows", "X64", "fmf-perf", "fmf-jit-ephemeral", $env:EXPECTED_RUNNER_LABEL
          ) | Sort-Object -CaseSensitive
          $actualLabels = @($job.labels) | Sort-Object -CaseSensitive
          if ($null -ne (Compare-Object -ReferenceObject $expectedLabels `
              -DifferenceObject $actualLabels -CaseSensitive)) {
            throw "Actions job labels do not exactly match the authorized JIT label set."
          }

      - name: Verify and stage the protected baseline before repository code exists
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path.TrimEnd('\', '/')
          $root = [IO.Path]::GetFullPath("P:\find-my-files\performance-baseline").TrimEnd('\', '/')
          $baseline = [IO.Path]::GetFullPath((Join-Path $root "criterion")).TrimEnd('\', '/')
          $separator = [IO.Path]::DirectorySeparatorChar
          if (-not $root.StartsWith("P:\find-my-files\", [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing unexpected performance baseline root '$root'."
          }
          foreach ($requiredDirectory in @($root, $baseline)) {
            if (-not (Test-Path -LiteralPath $requiredDirectory -PathType Container)) {
              throw "Protected performance baseline directory is missing: $requiredDirectory"
            }
          }

          foreach ($current in @("P:\", "P:\find-my-files", $root, $baseline)) {
            $item = Get-Item -LiteralPath $current -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Performance baseline path contains a reparse point: $current"
            }
          }
          $treeItems = @(Get-ChildItem -LiteralPath $baseline -Force -Recurse)
          if (@($treeItems | Where-Object {
              ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            }).Count -ne 0) {
            throw "Performance baseline tree contains a reparse point."
          }

          $runnerTempPrefix = "$runnerTemp$separator"
          $baselineVolume = Get-Volume -FilePath $baseline
          $systemVolume = Get-Volume -FilePath $env:SystemRoot
          $tempVolume = Get-Volume -FilePath $runnerTemp
          foreach ($volume in @($baselineVolume, $systemVolume, $tempVolume)) {
            if ($null -eq $volume -or [string]::IsNullOrWhiteSpace([string]$volume.UniqueId)) {
              throw "Could not bind a performance path to a stable volume identity."
            }
          }
          if ($baselineVolume.UniqueId -ceq $systemVolume.UniqueId -or
              $baselineVolume.UniqueId -ceq $tempVolume.UniqueId) {
            throw "Protected baseline must be attached on a volume separate from OS and scratch."
          }

          $expectedSids = @("S-1-5-18", "S-1-5-32-544")
          function Assert-BaselineAcl([string]$Path, [bool]$RequireProtected) {
            $acl = Get-Acl -LiteralPath $Path
            if ($RequireProtected -and -not $acl.AreAccessRulesProtected) {
              throw "Baseline ACL inheritance must be disabled on $Path."
            }
            $ownerSid = if ($acl.Owner -match '^S-\d(?:-\d+)+$') {
              ([Security.Principal.SecurityIdentifier]::new($acl.Owner)).Value
            } else {
              ([Security.Principal.NTAccount]::new($acl.Owner)).Translate(
                [Security.Principal.SecurityIdentifier]
              ).Value
            }
            if ($ownerSid -notin $expectedSids) {
              throw "Unexpected baseline owner SID '$ownerSid' on $Path."
            }
            $rules = @($acl.GetAccessRules(
              $true,
              $true,
              [Security.Principal.SecurityIdentifier]
            ))
            $expectedInheritance = [Security.AccessControl.InheritanceFlags]"ContainerInherit, ObjectInherit"
            $bad = @(
              $rules | Where-Object {
                ($RequireProtected -and $_.IsInherited) -or
                $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                $_.IdentityReference.Value -notin $expectedSids -or
                $_.FileSystemRights -ne [Security.AccessControl.FileSystemRights]::FullControl -or
                $_.InheritanceFlags -ne $expectedInheritance -or
                $_.PropagationFlags -ne [Security.AccessControl.PropagationFlags]::None
              }
            )
            $actualSids = @($rules | ForEach-Object {
              $_.IdentityReference.Value
            } | Sort-Object -CaseSensitive)
            $sortedExpected = @($expectedSids | Sort-Object -CaseSensitive)
            if ($bad.Count -ne 0 -or $rules.Count -ne 2 -or
                $null -ne (Compare-Object -ReferenceObject $sortedExpected `
                  -DifferenceObject $actualSids -CaseSensitive)) {
              throw "Baseline DACL on $Path is not the exact SYSTEM/Administrators contract."
            }
          }
          Assert-BaselineAcl $root $true
          Assert-BaselineAcl $baseline $false

          $scratch = [IO.Path]::GetFullPath(
            (Join-Path $runnerTemp "fmf-perf-baseline-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          )
          if (-not $scratch.StartsWith($runnerTempPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing unexpected baseline scratch path '$scratch'."
          }
          if (Test-Path -LiteralPath $scratch) {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }
          function Get-TreeManifest([string]$TreeRoot) {
            @(
              Get-ChildItem -LiteralPath $TreeRoot -File -Force -Recurse |
                ForEach-Object {
                  $relative = [IO.Path]::GetRelativePath($TreeRoot, $_.FullName).Replace('\', '/')
                  if ($relative -match '[\r\n|]') {
                    throw "Baseline path cannot be represented safely: '$relative'."
                  }
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$relative|$($_.Length)|$hash"
                } |
                Sort-Object -CaseSensitive
            )
          }
          $sourceManifest = @(Get-TreeManifest $baseline)
          if ($sourceManifest.Count -eq 0) {
            throw "Protected Criterion baseline is empty."
          }
          Copy-Item -LiteralPath $baseline -Destination $scratch -Recurse
          $copyManifest = @(Get-TreeManifest $scratch)
          if ($null -ne (Compare-Object -ReferenceObject $sourceManifest `
              -DifferenceObject $copyManifest -CaseSensitive)) {
            throw "Disposable Criterion baseline copy failed manifest verification."
          }
          "ready=true" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.authorize.outputs.commit_sha }}

      - name: Require the exact clean authorized checkout
        shell: pwsh
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne $env:AUTHORIZED_SHA) {
            throw "Checkout HEAD $head does not match pre-authorized measurement SHA $env:AUTHORIZED_SHA."
          }
          $dirty = @(git status --porcelain=v1 --untracked-files=normal)
          if ($dirty.Count -ne 0) {
            throw "The dedicated performance checkout is dirty: $($dirty -join '; ')"
          }
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path.TrimEnd('\', '/')
          $workspacePrefix = "$workspace$([IO.Path]::DirectorySeparatorChar)"
          $perfDir = [IO.Path]::GetFullPath((Join-Path $workspace "build/engine/perf"))
          if (-not $perfDir.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clear unexpected performance path '$perfDir'."
          }
          if (Test-Path -LiteralPath $perfDir) {
            Remove-Item -LiteralPath $perfDir -Recurse -Force
          }

      # CI installs only the narrow measurement toolchain. mise remains the local
      # environment manager and the source of version pins, not a CI dependency.
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: just@1.54.0
          fallback: none

      - name: Verify the pinned measurement toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content -LiteralPath mise.toml -Raw
          $expectedRust = [regex]::Match($config, '(?m)^rust\s*=\s*"([^"]+)"$').Groups[1].Value
          $expectedJust = [regex]::Match($config, '(?m)^just\s*=\s*"([^"]+)"$').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($expectedRust) -or [string]::IsNullOrWhiteSpace($expectedJust)) {
            throw "Could not read the Rust and just pins from mise.toml."
          }
          $rust = (rustc --version).Trim()
          $just = (just --version).Trim()
          if (-not $rust.StartsWith("rustc $expectedRust ")) {
            throw "Expected Rust $expectedRust, got '$rust'."
          }
          if ($just -cne "just $expectedJust") {
            throw "Expected just $expectedJust, got '$just'."
          }

      - name: Real-volume and microbenchmark regression gates
        id: gates
        env:
          FMF_PERF_BASELINE_DIR: ${{ runner.temp }}/fmf-perf-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        run: just perf-gate

      - name: Stage the deterministic evidence allowlist
        id: evidence
        if: ${{ always() && steps.prepare.outputs.ready == 'true' }}
        shell: pwsh
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $sources = [ordered]@{
            "real.json" = "build/engine/perf/real-check.json"
            "micro.json" = "build/engine/perf/micro-check/fmf-run.json"
          }
          $artifact = "build/performance-evidence"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $copied = 0
          foreach ($entry in $sources.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Value -PathType Leaf)) {
              if ($env:GATE_OUTCOME -ceq "success") {
                throw "Successful performance gate omitted $($entry.Value)."
              }
              continue
            }
            $evidence = Get-Content -LiteralPath $entry.Value -Raw | ConvertFrom-Json -Depth 100
            $expectedKind = if ($entry.Key -ceq "real.json") { "real-gate" } else { "micro-gate" }
            if ([int]$evidence.schema -ne 1 -or
                $evidence.kind -cne $expectedKind -or
                $evidence.target_sha -cne $env:AUTHORIZED_SHA -or
                [string]$evidence.semantic_cargo_lock_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                $null -eq $evidence.measurement -or
                $evidence.measurement.git.commit -cne $env:AUTHORIZED_SHA -or
                $evidence.measurement.cargo_lock_sha256 -cne
                  $evidence.semantic_cargo_lock_sha256 -or
                $null -eq $evidence.expected_cases -or
                $null -eq $evidence.cases) {
              throw "$($entry.Value) does not match performance evidence schema 1."
            }
            if ($env:GATE_OUTCOME -ceq "success" -and
                (-not [bool]$evidence.finite -or -not [bool]$evidence.passed)) {
              throw "Successful gate produced a non-passing $expectedKind verdict."
            }
            Copy-Item -LiteralPath $entry.Value -Destination (Join-Path $artifact $entry.Key)
            $copied++
          }
          if ($copied -gt 0) {
            "has_files=true" >> $env:GITHUB_OUTPUT
          }
          if ($env:GATE_OUTCOME -ceq "success" -and $copied -ne $sources.Count) {
            throw "Successful gate did not produce the complete two-file evidence allowlist."
          }

      - name: Require source cleanliness after measurement
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=normal)
          if ($dirty.Count -ne 0) {
            throw "Performance execution modified source: $($dirty -join '; ')"
          }

      - name: Upload commit-bound measurement evidence
        if: ${{ always() && steps.evidence.outputs.has_files == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-gate-evidence
          path: build/performance-evidence
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Remove disposable baseline copy
        if: ${{ always() }}
        shell: pwsh
        env:
          FMF_PERF_BASELINE_SCRATCH: ${{ runner.temp }}/fmf-perf-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:FMF_PERF_BASELINE_SCRATCH)) {
            "No disposable baseline copy was created."
            return
          }
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path.TrimEnd('\', '/')
          $runnerTempPrefix = "$runnerTemp$([IO.Path]::DirectorySeparatorChar)"
          $scratch = [IO.Path]::GetFullPath($env:FMF_PERF_BASELINE_SCRATCH)
          if (-not $scratch.StartsWith($runnerTempPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clear unexpected baseline scratch path '$scratch'."
          }
          if (Test-Path -LiteralPath $scratch) {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }

  record-baseline:
    needs: authorize
    if: ${{ needs.authorize.outputs.mode == 'baseline' }}
    name: performance-baseline-instrument
    environment: performance
    runs-on: # zizmor: ignore[self-hosted-runner] restricted organization runner group
      group: fmf-performance
      labels:
        - Windows
        - X64
        - fmf-perf
        - fmf-jit-ephemeral
        - ${{ needs.authorize.outputs.runner_label }}
    timeout-minutes: 180
    permissions:
      actions: read # bind this process to its exact in-progress JIT job
      contents: read # check out only the pre-authorized target commit
    steps:
      - name: Fail closed unless this job is in the restricted runner group
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_JOB: performance-baseline-instrument
          EXPECTED_RUNNER_NAME: ${{ needs.authorize.outputs.runner_name }}
          EXPECTED_RUNNER_LABEL: ${{ needs.authorize.outputs.runner_label }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $pages = gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp `
            "repos/$env:REPO/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" |
            ConvertFrom-Json -Depth 20
          $jobs = @($pages | ForEach-Object { $_.jobs })
          $matches = @(
            $jobs | Where-Object {
              $_.name -ceq $env:EXPECTED_JOB -and
              $_.runner_name -ceq $env:EXPECTED_RUNNER_NAME -and
              $_.status -ceq "in_progress"
            }
          )
          if ($matches.Count -ne 1) {
            throw "Could not bind this process to one in-progress Actions job."
          }
          $job = $matches[0]
          if ($job.runner_group_name -cne "fmf-performance" -or
              [int64]$job.runner_group_id -le 0) {
            throw "Job is not executing in the fmf-performance runner group."
          }
          if ($env:RUNNER_NAME -cne $env:EXPECTED_RUNNER_NAME) {
            throw "RUNNER_NAME '$env:RUNNER_NAME' is not the authorized one-time runner."
          }
          $expectedLabels = @(
            "Windows", "X64", "fmf-perf", "fmf-jit-ephemeral", $env:EXPECTED_RUNNER_LABEL
          ) | Sort-Object -CaseSensitive
          $actualLabels = @($job.labels) | Sort-Object -CaseSensitive
          if ($null -ne (Compare-Object -ReferenceObject $expectedLabels `
              -DifferenceObject $actualLabels -CaseSensitive)) {
            throw "Actions job labels do not exactly match the authorized JIT label set."
          }

      - name: Require the pre-provisioned protected baseline volume
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $principal = [Security.Principal.WindowsPrincipal]::new(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          if (-not $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "Baseline recording requires a fully elevated runner process."
          }

          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path.TrimEnd('\', '/')
          $productRoot = [IO.Path]::GetFullPath("P:\find-my-files")
          $root = [IO.Path]::GetFullPath((Join-Path $productRoot "performance-baseline"))
          $baseline = [IO.Path]::GetFullPath((Join-Path $root "criterion"))
          if (-not $root.StartsWith("P:\find-my-files\", [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing unexpected performance baseline root '$root'."
          }
          foreach ($existingPath in @("P:\", $productRoot, $root, $baseline)) {
            if (-not (Test-Path -LiteralPath $existingPath -PathType Container)) {
              throw "Provisioner did not attach the required baseline directory: $existingPath"
            }
            $item = Get-Item -LiteralPath $existingPath -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Performance baseline path contains a reparse point: $existingPath"
            }
          }

          $expectedSids = @("S-1-5-18", "S-1-5-32-544")
          function Assert-BaselineAcl([string]$Path, [bool]$RequireProtected) {
            $acl = Get-Acl -LiteralPath $Path
            if ($RequireProtected -and -not $acl.AreAccessRulesProtected) {
              throw "Baseline ACL inheritance must be disabled on $Path."
            }
            $ownerSid = if ($acl.Owner -match '^S-\d(?:-\d+)+$') {
              ([Security.Principal.SecurityIdentifier]::new($acl.Owner)).Value
            } else {
              ([Security.Principal.NTAccount]::new($acl.Owner)).Translate(
                [Security.Principal.SecurityIdentifier]
              ).Value
            }
            if ($ownerSid -notin $expectedSids) {
              throw "Unexpected baseline owner SID '$ownerSid' on $Path."
            }
            $rules = @($acl.GetAccessRules(
              $true,
              $true,
              [Security.Principal.SecurityIdentifier]
            ))
            $expectedInheritance = [Security.AccessControl.InheritanceFlags]"ContainerInherit, ObjectInherit"
            $bad = @(
              $rules | Where-Object {
                ($RequireProtected -and $_.IsInherited) -or
                $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                $_.IdentityReference.Value -notin $expectedSids -or
                $_.FileSystemRights -ne [Security.AccessControl.FileSystemRights]::FullControl -or
                $_.InheritanceFlags -ne $expectedInheritance -or
                $_.PropagationFlags -ne [Security.AccessControl.PropagationFlags]::None
              }
            )
            $actualSids = @($rules | ForEach-Object {
              $_.IdentityReference.Value
            } | Sort-Object -CaseSensitive)
            $sortedExpected = @($expectedSids | Sort-Object -CaseSensitive)
            if ($bad.Count -ne 0 -or $rules.Count -ne 2 -or
                $null -ne (Compare-Object -ReferenceObject $sortedExpected `
                  -DifferenceObject $actualSids -CaseSensitive)) {
              throw "Baseline DACL on $Path is not the exact SYSTEM/Administrators contract."
            }
          }
          Assert-BaselineAcl $root $true
          Assert-BaselineAcl $baseline $false

          $baselineVolume = Get-Volume -FilePath $baseline
          $systemVolume = Get-Volume -FilePath $env:SystemRoot
          $tempVolume = Get-Volume -FilePath $runnerTemp
          foreach ($volume in @($baselineVolume, $systemVolume, $tempVolume)) {
            if ($null -eq $volume -or [string]::IsNullOrWhiteSpace([string]$volume.UniqueId)) {
              throw "Could not bind a performance path to a stable volume identity."
            }
          }
          if ($baselineVolume.UniqueId -ceq $systemVolume.UniqueId -or
              $baselineVolume.UniqueId -ceq $tempVolume.UniqueId) {
            throw "Protected baseline must be attached on a volume separate from OS and scratch."
          }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.authorize.outputs.commit_sha }}

      - name: Require the exact clean authorized baseline checkout
        shell: pwsh
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne $env:AUTHORIZED_SHA) {
            throw "Checkout HEAD $head does not match authorized baseline SHA $env:AUTHORIZED_SHA."
          }
          $dirty = @(git status --porcelain=v1 --untracked-files=normal)
          if ($dirty.Count -ne 0) {
            throw "The baseline checkout is dirty: $($dirty -join '; ')"
          }

      # mise remains the local environment manager. CI installs the narrow,
      # pinned measurement dependencies directly.
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: just@1.54.0
          fallback: none

      - name: Verify the pinned measurement toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content -LiteralPath mise.toml -Raw
          $expectedRust = [regex]::Match($config, '(?m)^rust\s*=\s*"([^"]+)"$').Groups[1].Value
          $expectedJust = [regex]::Match($config, '(?m)^just\s*=\s*"([^"]+)"$').Groups[1].Value
          $rust = (rustc --version).Trim()
          $just = (just --version).Trim()
          if ([string]::IsNullOrWhiteSpace($expectedRust) -or
              -not $rust.StartsWith("rustc $expectedRust ")) {
            throw "Pinned Rust toolchain validation failed: '$rust'."
          }
          if ([string]::IsNullOrWhiteSpace($expectedJust) -or
              $just -cne "just $expectedJust") {
            throw "Pinned just validation failed: '$just'."
          }

      # Record the tracked real-volume baseline first. It is staged as data, then
      # the checkout is restored before the persistent Criterion promotion.
      - name: Record real-volume baseline
        run: "just bench-baseline C:"

      - name: Validate and stage the real-volume candidate
        shell: pwsh
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = "engine/benches/baseline.json"
          $baseline = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -Depth 30
          $measurement = $baseline.measurement
          if ($null -eq $measurement -or
              [int]$measurement.schema -ne 1 -or
              $measurement.kind -cne "real-baseline" -or
              $measurement.git.commit -cne $env:AUTHORIZED_SHA -or
              [bool]$measurement.git.dirty -or
              [string]$measurement.git.dirty_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$measurement.cargo_lock_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [uint64]$measurement.started_unix -eq 0 -or
              [uint64]$measurement.finished_unix -lt [uint64]$measurement.started_unix) {
            throw "Real baseline measurement identity is incomplete or dirty."
          }
          foreach ($phase in @("preflight", "during", "postflight")) {
            $counter = $measurement.counters.$phase
            if ($null -eq $counter -or
                [double]$counter.mean_processor_performance -le 0 -or
                [double]$counter.min_processor_performance -le 0 -or
                [double]$counter.mean_processor_time -lt 0 -or
                [double]$counter.max_processor_time -lt 0) {
              throw "Real baseline has invalid '$phase' counter evidence."
            }
          }
          $expectedQueries = @(
            "", "e", "a", "win", "Win", "qzx", "ext:dll",
            "size:>100mb path:windows", "*.rs", "regex:win.*\.dll"
          )
          $actualQueries = @($baseline.queries | ForEach-Object { [string]$_.query })
          if ([string]$baseline.volume -cne "C:" -or
              [uint64]$baseline.entries -eq 0 -or
              [uint64]$baseline.peak_working_set_bytes -eq 0 -or
              $actualQueries.Count -ne $expectedQueries.Count) {
            throw "Real baseline has an invalid volume, corpus, or query suite."
          }
          for ($index = 0; $index -lt $expectedQueries.Count; $index++) {
            if ($actualQueries[$index] -cne $expectedQueries[$index]) {
              throw "Real baseline query suite drifted at index $index."
            }
          }
          foreach ($query in @($baseline.queries)) {
            foreach ($field in @(
              "hits", "p50_us", "p99_us", "max_us", "p50_memo_us",
              "p50_scan_us", "p50_materialize_us", "cold_us"
            )) {
              if ($null -eq $query.$field -or [int64]$query.$field -lt 0) {
                throw "Real baseline query '$($query.query)' has invalid '$field'."
              }
            }
          }
          if ($null -eq $baseline.restore -or
              [uint64]$baseline.restore.file_bytes -eq 0 -or
              [uint64]$baseline.restore.entries -ne [uint64]$baseline.entries -or
              [uint64]$baseline.restore.save_ms -eq 0 -or
              [uint64]$baseline.restore.p50_ms -eq 0 -or
              [uint64]$baseline.restore.min_ms -eq 0) {
            throw "Real baseline restore evidence is missing or inconsistent."
          }

          $artifactDir = "build/performance-baseline"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -LiteralPath $path -Destination "$artifactDir/baseline.json"
          git restore --source=HEAD -- $path
          $dirty = @(git status --porcelain=v1 --untracked-files=normal)
          if ($dirty.Count -ne 0) {
            throw "Checkout was not restored after staging the candidate: $($dirty -join '; ')"
          }

      - name: Record persistent Criterion baseline
        env:
          FMF_PERF_BASELINE_DIR: P:\find-my-files\performance-baseline\criterion
        run: just bench-micro-baseline

      - name: Validate the promoted Criterion baseline and source cleanliness
        shell: pwsh
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
          FMF_PERF_BASELINE_DIR: P:\find-my-files\performance-baseline\criterion
        run: |
          $ErrorActionPreference = "Stop"
          $metadataPath = Join-Path $env:FMF_PERF_BASELINE_DIR "fmf-baseline.json"
          $measurement = Get-Content -LiteralPath $metadataPath -Raw |
            ConvertFrom-Json -Depth 20
          if ([int]$measurement.schema -ne 1 -or
              $measurement.kind -cne "micro-baseline" -or
              $measurement.git.commit -cne $env:AUTHORIZED_SHA -or
              [bool]$measurement.git.dirty -or
              [string]$measurement.git.dirty_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$measurement.cargo_lock_sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "Criterion baseline measurement identity is incomplete or dirty."
          }
          foreach ($phase in @("preflight", "during", "postflight")) {
            $counter = $measurement.counters.$phase
            if ($null -eq $counter -or
                [double]$counter.mean_processor_performance -le 0 -or
                [double]$counter.min_processor_performance -le 0 -or
                [double]$counter.mean_processor_time -lt 0 -or
                [double]$counter.max_processor_time -lt 0) {
              throw "Criterion baseline has invalid '$phase' counter evidence."
            }
          }
          $benchmarks = @(
            Get-Content -LiteralPath "engine/benches/criterion-benchmarks.txt" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )
          if ($benchmarks.Count -eq 0 -or
              $benchmarks.Count -ne @($benchmarks | Sort-Object -Unique).Count) {
            throw "Criterion benchmark manifest is empty or contains duplicates."
          }
          foreach ($benchmark in $benchmarks) {
            $committed = Join-Path $env:FMF_PERF_BASELINE_DIR "$benchmark/committed"
            foreach ($file in @("benchmark.json", "estimates.json", "sample.json", "tukey.json")) {
              if (-not (Test-Path -LiteralPath (Join-Path $committed $file) -PathType Leaf)) {
                throw "Criterion baseline is missing $benchmark/committed/$file."
              }
            }
          }
          $dirty = @(git status --porcelain=v1 --untracked-files=normal)
          if ($dirty.Count -ne 0) {
            throw "Performance recording modified source: $($dirty -join '; ')"
          }

      - name: Upload immutable real-volume candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-baseline-${{ needs.authorize.outputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance-baseline/baseline.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  validate-baseline:
    needs: [authorize, record-baseline]
    if: >-
      ${{
        needs.authorize.outputs.mode == 'baseline' &&
        needs.record-baseline.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # download the candidate from this exact controller run
      contents: read # retrieve immutable target-tree blobs for validation
    outputs:
      candidate_sha256: ${{ steps.validate.outputs.candidate_sha256 }}
    steps:
      - name: Download immutable baseline candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-baseline-${{ needs.authorize.outputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate candidate without write authority
        id: validate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
        run: |
          import base64
          import binascii
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          candidate_root = pathlib.Path("candidate")
          if (
              not candidate_root.is_dir()
              or candidate_root.is_symlink()
          ):
              raise SystemExit("baseline artifact root is not a directory")
          candidate_files = set()
          for path in candidate_root.rglob("*"):
              relative = path.relative_to(candidate_root).as_posix()
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"baseline artifact contains non-file entry: {relative}"
                  )
              candidate_files.add(relative)
          if candidate_files != {"baseline.json"}:
              raise SystemExit(
                  "baseline artifact does not match the one-file allowlist"
              )
          candidate_path = candidate_root / "baseline.json"
          if not 0 < candidate_path.stat().st_size <= 1_000_000:
              raise SystemExit("baseline candidate size is invalid")

          def api_json(endpoint):
              completed = subprocess.run(
                  ["gh", "api", endpoint],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(completed.stdout)

          repo = os.environ["REPO"]
          authorized_sha = os.environ["AUTHORIZED_SHA"]
          tree = api_json(f"repos/{repo}/git/trees/{authorized_sha}?recursive=1")
          if tree.get("truncated") is not False:
              raise SystemExit("target Git tree response was truncated")
          entries = tree.get("tree")
          if not isinstance(entries, list):
              raise SystemExit("target Git tree has no entries")

          manifest_pattern = re.compile(
              r"^engine/crates/[A-Za-z0-9_-]+/Cargo[.]toml$"
          )
          required_paths = {"engine/Cargo.lock", "engine/Cargo.toml"}
          required_paths.update(
              entry.get("path")
              for entry in entries
              if entry.get("type") == "blob"
              and isinstance(entry.get("path"), str)
              and manifest_pattern.fullmatch(entry["path"])
          )

          identity_root = pathlib.Path("identity")
          for source_path in sorted(required_paths):
              matches = [
                  entry
                  for entry in entries
                  if entry.get("path") == source_path
                  and entry.get("type") == "blob"
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"target tree has no unique blob for {source_path}"
                  )
              entry = matches[0]
              blob = api_json(f"repos/{repo}/git/blobs/{entry['sha']}")
              if blob.get("encoding") != "base64":
                  raise SystemExit(
                      f"target blob is not base64 encoded: {source_path}"
                  )
              encoded = blob.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit(f"target blob has no content: {source_path}")
              try:
                  content = base64.b64decode(
                      "".join(encoded.splitlines()),
                      validate=True,
                  )
              except binascii.Error as error:
                  raise SystemExit(
                      f"target blob is invalid base64: {source_path}"
                  ) from error
              if (
                  blob.get("size") != len(content)
                  or entry.get("size") != len(content)
              ):
                  raise SystemExit(f"target blob size mismatch: {source_path}")
              destination = identity_root / source_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError(f"duplicate JSON key {key!r}")
                  result[key] = value
              return result

          with candidate_path.open("r", encoding="utf-8") as stream:
              candidate = json.load(
                  stream,
                  object_pairs_hook=pairs,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite JSON number {value}")
                  ),
              )
          root_keys = {
              "volume", "entries", "index_ms", "working_set_bytes",
              "peak_working_set_bytes", "queries", "restore", "measurement",
          }
          if not isinstance(candidate, dict) or set(candidate) != root_keys:
              raise ValueError("baseline root does not match schema 1")

          engine = pathlib.Path("identity/engine")
          workspace_doc = tomllib.loads((engine / "Cargo.toml").read_text("utf-8"))
          members = workspace_doc["workspace"]["members"]
          if (
              not isinstance(members, list)
              or not members
              or len(members) != len(set(members))
              or any(not re.fullmatch(r"crates/[A-Za-z0-9_-]+", item) for item in members)
          ):
              raise ValueError("workspace member contract is invalid")
          workspace_version = workspace_doc["workspace"]["package"]["version"]
          if not isinstance(workspace_version, str) or not workspace_version:
              raise ValueError("workspace package version is invalid")
          workspace_packages = {}
          for member in members:
              package = tomllib.loads(
                  (engine / member / "Cargo.toml").read_text("utf-8")
              )["package"]
              name = package["name"]
              if not isinstance(name, str) or not name:
                  raise ValueError(f"invalid workspace package name in {member}")
              version = package["version"]
              if isinstance(version, dict):
                  if version != {"workspace": True}:
                      raise ValueError(
                          f"invalid inherited workspace version in {member}"
                      )
                  version = workspace_version
              elif not isinstance(version, str) or not version:
                  raise ValueError(f"invalid workspace version in {member}")
              if name in workspace_packages:
                  raise ValueError(f"duplicate workspace package {name}")
              workspace_packages[name] = version
          lock_text = (engine / "Cargo.lock").read_text("utf-8").replace("\r\n", "\n")
          lock_doc = tomllib.loads(lock_text)
          found = {
              str(package["name"])
              for package in lock_doc["package"]
              if "source" not in package and str(package["name"]) in workspace_packages
          }
          if found != set(workspace_packages):
              raise ValueError("Cargo.lock workspace package set is incomplete")
          pieces = lock_text.split("[[package]]")
          canonical = pieces[0]
          for suffix in pieces[1:]:
              block = "[[package]]" + suffix
              package = tomllib.loads(block)["package"][0]
              name = str(package["name"])
              if "source" not in package and name in workspace_packages:
                  version = workspace_packages[name]
                  if str(package["version"]) != version:
                      raise ValueError(f"workspace lock version mismatch for {name}")
                  exact = f'version = "{version}"'
                  if block.splitlines().count(exact) != 1:
                      raise ValueError(f"non-canonical workspace version for {name}")
                  block = block.replace(exact, 'version = "<workspace-version>"', 1)
              canonical += block
          for name, version in workspace_packages.items():
              canonical = canonical.replace(
                  f'"{name} {version}"', f'"{name} <workspace-version>"'
              )
          semantic_lock = hashlib.sha256(canonical.encode()).hexdigest()

          measurement = candidate["measurement"]
          measurement_keys = {
              "schema", "kind", "started_unix", "finished_unix", "git",
              "cargo_lock_sha256", "rustc", "processor", "logical_processors", "counters",
          }
          if not isinstance(measurement, dict) or set(measurement) != measurement_keys:
              raise ValueError("baseline measurement keys are invalid")
          git = measurement["git"]
          if (
              measurement["schema"] != 1
              or measurement["kind"] != "real-baseline"
              or not isinstance(git, dict)
              or set(git) != {"commit", "dirty", "dirty_sha256"}
              or git["commit"] != os.environ["AUTHORIZED_SHA"]
              or git["dirty"] is not False
              or not isinstance(git["dirty_sha256"], str)
              or not re.fullmatch(r"[0-9a-f]{64}", git["dirty_sha256"])
              or measurement["cargo_lock_sha256"] != semantic_lock
              or not isinstance(measurement["started_unix"], int)
              or isinstance(measurement["started_unix"], bool)
              or measurement["started_unix"] <= 0
              or not isinstance(measurement["finished_unix"], int)
              or isinstance(measurement["finished_unix"], bool)
              or measurement["finished_unix"] < measurement["started_unix"]
              or not isinstance(measurement["rustc"], str)
              or not measurement["rustc"].startswith("rustc ")
              or not isinstance(measurement["processor"], str)
              or not measurement["processor"].strip()
              or measurement["processor"] == "unknown"
              or not isinstance(measurement["logical_processors"], int)
              or isinstance(measurement["logical_processors"], bool)
              or measurement["logical_processors"] <= 0
          ):
              raise ValueError("baseline measurement identity is invalid")
          if set(measurement["counters"]) != {"preflight", "during", "postflight"}:
              raise ValueError("baseline counter phases are invalid")
          counter_keys = {
              "mean_processor_performance", "mean_processor_time",
              "min_processor_performance", "max_processor_time",
          }
          for phase, counters in measurement["counters"].items():
              if set(counters) != counter_keys:
                  raise ValueError(f"invalid {phase} counter keys")
              values = {
                  key: float(counters[key])
                  for key in counter_keys
                  if not isinstance(counters[key], bool)
                  and isinstance(counters[key], (int, float))
                  and math.isfinite(float(counters[key]))
              }
              if (
                  len(values) != len(counter_keys)
                  or values["mean_processor_performance"] < 95.0
                  or values["min_processor_performance"] <= 0.0
                  or values["mean_processor_time"] < 0.0
                  or values["max_processor_time"] < 0.0
                  or (phase != "during" and values["mean_processor_time"] > 20.0)
              ):
                  raise ValueError(f"baseline {phase} counters are invalid")

          def positive_int(value):
              return isinstance(value, int) and not isinstance(value, bool) and value > 0

          def nonnegative_int(value):
              return isinstance(value, int) and not isinstance(value, bool) and value >= 0

          queries = [
              "", "e", "a", "win", "Win", "qzx", "ext:dll",
              "size:>100mb path:windows", "*.rs", r"regex:win.*\.dll",
          ]
          query_keys = {
              "query", "hits", "p50_us", "p99_us", "max_us", "p50_memo_us",
              "p50_scan_us", "p50_materialize_us", "cold_us",
          }
          if (
              candidate["volume"] != "C:"
              or not positive_int(candidate["entries"])
              or not positive_int(candidate["index_ms"])
              or not positive_int(candidate["working_set_bytes"])
              or not positive_int(candidate["peak_working_set_bytes"])
              or not isinstance(candidate["queries"], list)
              or [query.get("query") for query in candidate["queries"]] != queries
          ):
              raise ValueError("baseline corpus or query contract is invalid")
          for query in candidate["queries"]:
              if set(query) != query_keys or any(
                  not nonnegative_int(query[field]) for field in query_keys - {"query"}
              ):
                  raise ValueError(f"baseline query {query.get('query')} is invalid")
          restore = candidate["restore"]
          if (
              not isinstance(restore, dict)
              or set(restore) != {"file_bytes", "entries", "save_ms", "p50_ms", "min_ms"}
              or not all(positive_int(restore[field]) for field in restore)
              or restore["entries"] != candidate["entries"]
          ):
              raise ValueError("baseline restore evidence is invalid")

          digest = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_sha256={digest}\n")
          print(f"validated baseline candidate {digest} / {semantic_lock}")

  propose-baseline:
    needs: [authorize, validate-baseline]
    if: >-
      ${{
        needs.authorize.outputs.mode == 'baseline' &&
        needs.validate-baseline.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    permissions:
      actions: read # re-download the already validated immutable candidate
      contents: read # inspect the baseline branch before minting write authority
    steps:
      - name: Download the already-validated immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-baseline-${{ needs.authorize.outputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Bind write job to the validated candidate bytes
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.validate-baseline.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::validated candidate digest is invalid"
            exit 1
          fi
          mapfile -t files < <(find candidate -mindepth 1 -printf '%P\n' | sort)
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "baseline.json" ] ||
             [ ! -f candidate/baseline.json ] || [ -L candidate/baseline.json ]; then
            echo "::error::write job candidate does not match the one-file allowlist"
            exit 1
          fi
          echo "$EXPECTED_SHA256  candidate/baseline.json" | sha256sum --check --strict

      - name: Mint short-lived baseline-writer App token
        id: writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose the fixed baseline file through a draft PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.commit_sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA256: ${{ needs.validate-baseline.outputs.candidate_sha256 }}
        with:
          github-token: ${{ steps.writer-token.outputs.token }}
          script: |
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetPath = "engine/benches/baseline.json";
            const authorizedSha = process.env.AUTHORIZED_SHA;
            const sourceRunId = process.env.SOURCE_RUN_ID;
            const expectedCandidateHash = process.env.EXPECTED_SHA256;
            if (!/^[0-9]+$/.test(sourceRunId)) {
              throw new Error(`Invalid controller run id '${sourceRunId}'.`);
            }
            const candidate = fs.readFileSync("candidate/baseline.json");
            const candidateHash = crypto.createHash("sha256").update(candidate).digest("hex");
            if (
              !/^[0-9a-f]{64}$/.test(expectedCandidateHash) ||
              candidateHash !== expectedCandidateHash
            ) {
              throw new Error(
                `Candidate changed after hosted validation: ` +
                  `${candidateHash} != ${expectedCandidateHash}.`,
              );
            }
            const branch =
              `automation/performance-baseline-${authorizedSha.slice(0, 12)}-${sourceRunId}`;
            const ref = `heads/${branch}`;

            const requireMainCas = async () => {
              const { data } = await github.rest.git.getRef({
                owner,
                repo,
                ref: "heads/main",
              });
              const mainSha = String(data.object.sha).toLowerCase();
              if (mainSha !== authorizedSha) {
                throw new Error(
                  `Protected main moved from authorized ${authorizedSha} to ${mainSha}; remeasure.`,
                );
              }
            };
            const readFile = async (refName) => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: targetPath,
                ref: refName,
              });
              if (Array.isArray(data) || data.type !== "file" || data.encoding !== "base64") {
                throw new Error(`${targetPath} is not a normal repository file.`);
              }
              return {
                sha: data.sha,
                bytes: Buffer.from(String(data.content).replace(/\n/g, ""), "base64"),
              };
            };
            const sameCandidate = (bytes) =>
              crypto.createHash("sha256").update(bytes).digest("hex") === candidateHash &&
              bytes.equals(candidate);
            const validateBranch = async (expectedSha) => {
              const [{ data: branchRef }, { data: commit }, { data: comparison }] =
                await Promise.all([
                  github.rest.git.getRef({ owner, repo, ref }),
                  github.rest.git.getCommit({ owner, repo, commit_sha: expectedSha }),
                  github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${authorizedSha}...${expectedSha}`,
                  }),
                ]);
              const liveSha = String(branchRef.object.sha).toLowerCase();
              if (liveSha !== expectedSha) {
                throw new Error(`Branch ${branch} moved from ${expectedSha} to ${liveSha}.`);
              }
              if (
                commit.parents.length !== 1 ||
                String(commit.parents[0].sha).toLowerCase() !== authorizedSha
              ) {
                throw new Error(`Branch ${branch} is not a one-parent child of ${authorizedSha}.`);
              }
              if (
                comparison.status !== "ahead" ||
                comparison.ahead_by !== 1 ||
                comparison.behind_by !== 0 ||
                comparison.total_commits !== 1 ||
                !Array.isArray(comparison.files) ||
                comparison.files.length !== 1 ||
                comparison.files[0].filename !== targetPath ||
                comparison.files[0].status !== "modified"
              ) {
                throw new Error(
                  `Branch ${branch} must modify only ${targetPath} in one commit.`,
                );
              }
              const branchFile = await readFile(expectedSha);
              if (!sameCandidate(branchFile.bytes)) {
                throw new Error(`Branch ${branch} does not contain the measured candidate.`);
              }
            };

            await requireMainCas();
            const mainFile = await readFile(authorizedSha);
            if (sameCandidate(mainFile.bytes)) {
              core.info("Recorded real-volume baseline is unchanged; no PR is required.");
              return;
            }

            let branchSha;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref });
              branchSha = String(data.object.sha).toLowerCase();
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await requireMainCas();
              const { data } = await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${ref}`,
                sha: authorizedSha,
              });
              branchSha = String(data.object.sha).toLowerCase();
            }

            if (branchSha === authorizedSha) {
              await requireMainCas();
              const { data: baseCommit } = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: authorizedSha,
              });
              const { data: blob } = await github.rest.git.createBlob({
                owner,
                repo,
                content: candidate.toString("base64"),
                encoding: "base64",
              });
              const { data: tree } = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: baseCommit.tree.sha,
                tree: [{
                  path: targetPath,
                  mode: "100644",
                  type: "blob",
                  sha: blob.sha,
                }],
              });
              const { data: commit } = await github.rest.git.createCommit({
                owner,
                repo,
                message: "perf: refresh measurement baseline",
                tree: tree.sha,
                parents: [authorizedSha],
              });
              const candidateCommit = String(commit.sha).toLowerCase();
              const { data: updatedRef } = await github.rest.git.updateRef({
                owner,
                repo,
                ref,
                sha: candidateCommit,
                force: false,
              });
              branchSha = String(updatedRef.object.sha).toLowerCase();
              if (branchSha !== candidateCommit) {
                throw new Error(
                  `Branch update returned ${branchSha}, expected ${candidateCommit}.`,
                );
              }
            }
            await validateBranch(branchSha);

            await requireMainCas();
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base: "main",
              per_page: 100,
            });
            if (pulls.length > 1) {
              throw new Error(`Branch ${branch} has multiple open pull requests.`);
            }
            if (pulls.length === 1) {
              if (
                pulls[0].draft !== true ||
                pulls[0].title !== "perf: refresh measurement baseline" ||
                pulls[0].head?.ref !== branch ||
                String(pulls[0].head?.sha).toLowerCase() !== branchSha ||
                pulls[0].head?.repo?.full_name !== `${owner}/${repo}` ||
                pulls[0].base?.ref !== "main" ||
                pulls[0].base?.repo?.full_name !== `${owner}/${repo}`
              ) {
                throw new Error("Existing baseline PR is not the expected draft.");
              }
              core.info(`Baseline draft PR #${pulls[0].number} already exists.`);
              return;
            }
            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: "main",
              draft: true,
              title: "perf: refresh measurement baseline",
              body:
                "Automated, commit-bound real-volume baseline refresh. " +
                `Measured protected-main commit \`${authorizedSha}\` on the approved ` +
                "`fmf-performance` instrument. Review the numeric deltas; CI validates " +
                "that this PR changes only the canonical baseline file.",
            });
            if (
              pull.draft !== true ||
              pull.head?.ref !== branch ||
              String(pull.head?.sha).toLowerCase() !== branchSha ||
              pull.head?.repo?.full_name !== `${owner}/${repo}` ||
              pull.base?.ref !== "main" ||
              pull.base?.repo?.full_name !== `${owner}/${repo}`
            ) {
              throw new Error("Created pull request identity does not match the authorized branch.");
            }
            core.info(`Created baseline draft PR #${pull.number} at ${branchSha}.`);
