name: performance-gate-request
run-name: performance-gate ${{ inputs.tag_name }} ${{ inputs.commit_sha }} release ${{ inputs.release_id }}

# This workflow is intentionally hosted-only. A workflow_dispatch loads YAML from
# the selected ref, so it must never contain a self-hosted job. Its successful run
# is merely a request; performance-controller.yml, loaded from the default branch by
# workflow_run, repeats every authorization check before assigning the instrument.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag to measure"
        required: true
        type: string
      commit_sha:
        description: "Exact immutable tag commit to measure"
        required: true
        type: string
      release_id:
        description: "Exact existing Release Please draft release ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: performance-gate-request-${{ inputs.tag_name }}-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the measurement request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TAG: ${{ inputs.tag_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.TAG;
            const requestedSha = process.env.REQUESTED_SHA;
            const releaseIdText = process.env.RELEASE_ID;
            const requestRef = process.env.REQUEST_REF;
            const requestSha = process.env.REQUEST_SHA;
            const repository = process.env.REPO;

            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) {
              throw new Error(`Performance gating requires an exact vX.Y.Z tag, got '${tag}'.`);
            }
            if (!/^[0-9a-f]{40}$/.test(requestedSha)) {
              throw new Error(`Requested SHA '${requestedSha}' is not a lowercase commit identity.`);
            }
            if (!/^[1-9][0-9]*$/.test(releaseIdText)) {
              throw new Error(`Release ID '${releaseIdText}' is not an exact numeric identity.`);
            }
            if (requestRef !== "refs/heads/main") {
              throw new Error(`Performance requests must execute from protected main, got '${requestRef}'.`);
            }
            if (!/^[0-9a-f]{40}$/.test(requestSha)) {
              throw new Error(`Request SHA '${requestSha}' is not an immutable commit identity.`);
            }

            const parts = repository.split("/");
            if (parts.length !== 2 || parts.some((part) => part.length === 0)) {
              throw new Error(`Invalid repository identity '${repository}'.`);
            }
            const [owner, repo] = parts;
            const { data: requestComparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${requestSha}...main`,
              });
            if (
              requestComparison.status !== "ahead" &&
              requestComparison.status !== "identical"
            ) {
              throw new Error(
                `Request controller ${requestSha} is not on main's protected lineage ` +
                  `(compare status: ${requestComparison.status}).`,
              );
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: tag,
            });
            const tagSha = String(commit.sha).toLowerCase();
            if (tagSha !== requestedSha) {
              throw new Error(`Tag ${tag} resolves to ${tagSha}, not requested ${requestedSha}.`);
            }
            const { data: measurementComparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${tagSha}...main`,
              });
            if (
              measurementComparison.status !== "ahead" &&
              measurementComparison.status !== "identical"
            ) {
              throw new Error(
                `${tag} is not on main's protected lineage ` +
                  `(compare status: ${measurementComparison.status}).`,
              );
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: Number(releaseIdText),
            });
            if (
              String(release.id) !== releaseIdText ||
              release.draft !== true ||
              release.prerelease !== false ||
              release.tag_name !== tag ||
              release.name !== tag
            ) {
              throw new Error(`Release ${releaseIdText} is not the exact ${tag} draft.`);
            }
            const targetSha = String(release.target_commitish ?? "").toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(targetSha) || targetSha !== tagSha) {
              throw new Error(
                `Draft target '${targetSha}' must be the exact tag commit ${tagSha}.`,
              );
            }

            core.info(
              `Requested performance measurement of release ${releaseIdText}, ${tag} at ${tagSha}.`,
            );
