name: performance-release
run-name: performance-release ${{ github.event.workflow_run.display_title }}

# Deliberately separate from performance-controller.yml. The elevated self-hosted
# runner executes repository code with read-only authority. Only after GitHub has
# recorded that entire workflow as successful does this hosted, no-checkout job
# authorize the trusted reusable release workflow.
on: # zizmor: ignore[dangerous-triggers] intentional no-checkout privilege split described above
  workflow_run:
    workflows: [performance-controller]
    types: [completed]

permissions: {}

# A release commit may briefly produce more than one completion event (for
# example a manual re-run). Serialize the API-only decision so two hosted jobs
# cannot both observe "not dispatched yet" and race each other.
concurrency:
  group: performance-release-${{ github.event.workflow_run.display_title }}
  cancel-in-progress: false

jobs:
  authorize-release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run' &&
        startsWith(github.event.workflow_run.display_title, 'performance-gate ')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # inspect the exact completed performance run and evidence
      contents: read # validate protected refs, release drafts, and target blobs
    outputs:
      release_needed: ${{ steps.release_decision.outputs.release_needed }}
      tag_name: ${{ steps.identity.outputs.tag_name }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      performance_run_id: ${{ steps.identity.outputs.performance_run_id }}
      release_id: ${{ steps.identity.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      CONTROLLER_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate evidence and authorize the matching draft
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid performance source identity"
            exit 1
          fi

          source_run=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID")
          expected_workflow_id=$(
            gh api "repos/$REPO/actions/workflows/performance-controller.yml" --jq '.id'
          )
          if [ "$(jq -r '.event' <<<"$source_run")" != "workflow_run" ] ||
             [ "$(jq -r '.status' <<<"$source_run")" != "completed" ] ||
             [ "$(jq -r '.conclusion' <<<"$source_run")" != "success" ] ||
             [ "$(jq -r '.head_branch' <<<"$source_run")" != "main" ] ||
             [ "$(jq -r '.head_sha' <<<"$source_run")" != "$CONTROLLER_SHA" ] ||
             [ "$(jq -r '.workflow_id' <<<"$source_run")" != "$expected_workflow_id" ] ||
             [ "$(jq -r '.repository.full_name' <<<"$source_run")" != "$REPO" ]; then
            echo "::error::performance source run identity is not trustworthy"
            exit 1
          fi
          controller_lineage=$(gh api \
            "repos/$REPO/compare/$CONTROLLER_SHA...main" --jq '.status')
          if [ "$controller_lineage" != "ahead" ] &&
             [ "$controller_lineage" != "identical" ]; then
            echo "::error::performance controller is not on main's protected lineage"
            exit 1
          fi

          artifacts=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          artifact_count=$(jq '.artifacts | length' <<<"$artifacts")
          evidence_count=$(jq '
            [.artifacts[] | select(
              .name == "performance-gate-evidence" and
              (.expired | not) and
              .size_in_bytes > 0
            )] | length
          ' <<<"$artifacts")
          if [ "$artifact_count" -ne 1 ] || [ "$evidence_count" -ne 1 ]; then
            echo "::error::performance run artifacts do not match the one-name allowlist"
            exit 1
          fi

          run_title=$(jq -r '.display_title' <<<"$source_run")
          if [[ "$run_title" =~ ^performance-gate\ (v[0-9]+\.[0-9]+\.[0-9]+)\ ([0-9a-f]{40})\ release\ ([1-9][0-9]*)$ ]]; then
            tag="${BASH_REMATCH[1]}"
            measured_sha="${BASH_REMATCH[2]}"
            release_id="${BASH_REMATCH[3]}"
          else
            echo "::error::performance run title is not bound to an exact release ID and tag commit"
            exit 1
          fi
          tag_sha=$(gh api "repos/$REPO/commits/$tag" --jq '.sha')
          if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$tag_sha" != "$measured_sha" ]; then
            echo "::error::$tag resolves to $tag_sha, not measured commit $measured_sha"
            exit 1
          fi
          lineage=$(gh api "repos/$REPO/compare/$tag_sha...main" --jq '.status')
          if [ "$lineage" != "ahead" ] && [ "$lineage" != "identical" ]; then
            echo "::error::$tag is not on main's protected lineage"
            exit 1
          fi
          {
            echo "tag_name=$tag"
            echo "commit_sha=$measured_sha"
            echo "performance_run_id=$SOURCE_RUN_ID"
            echo "release_id=$release_id"
          } >>"$GITHUB_OUTPUT"

      - name: Authorize the exact draft or verify completed publication
        id: release_decision
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag_name }}
          TARGET_SHA: ${{ steps.identity.outputs.commit_sha }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::resolved release identity outputs are invalid"
            exit 1
          fi
          live_tag_sha=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')
          release=$(gh api "repos/$REPO/releases/$RELEASE_ID")
          if [ "$live_tag_sha" != "$TARGET_SHA" ] ||
             [ "$(jq -r '.id | tostring' <<<"$release")" != "$RELEASE_ID" ] ||
             [ "$(jq -r '.prerelease' <<<"$release")" != "false" ] ||
             [ "$(jq -r '.tag_name' <<<"$release")" != "$TAG" ] ||
             [ "$(jq -r '.name' <<<"$release")" != "$TAG" ] ||
             [ "$(jq -r '.target_commitish' <<<"$release")" != "$TARGET_SHA" ]; then
            echo "::error::release $RELEASE_ID identity differs from measured $TAG at $TARGET_SHA"
            exit 1
          fi
          if [ "$(jq -r '.draft' <<<"$release")" = "true" ]; then
            echo "release_needed=true" >>"$GITHUB_OUTPUT"
          elif [ "$(jq -r '.immutable' <<<"$release")" = "true" ]; then
            expected_zip="find-my-files-$TAG-win-x64.zip"
            published_assets_valid=$(jq --arg zip "$expected_zip" '
              ([.assets[].name] | sort) ==
                ([$zip, "SHA256SUMS.txt", "app.cdx.json", "fmf-engine.cdx.json"] | sort) and
              all(.assets[];
                .state == "uploaded" and
                (.id | tostring | test("^[1-9][0-9]*$")) and
                (.digest | type == "string") and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' <<<"$release")
            if [ "$published_assets_valid" != "true" ]; then
              echo "::error::immutable release $RELEASE_ID has an incomplete or invalid asset set"
              exit 1
            fi
            echo "release_needed=false" >>"$GITHUB_OUTPUT"
            echo "Immutable release $RELEASE_ID / $TAG is complete — no duplicate dispatch."
          else
            echo "::error::release $RELEASE_ID is neither the expected draft nor immutable publication"
            exit 1
          fi

      - name: Download evidence from the exact controller run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-gate-evidence
          path: evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Strictly verify both performance summaries
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.identity.outputs.commit_sha }}
        run: |
          import base64
          import binascii
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          def api_json(endpoint):
              completed = subprocess.run(
                  ["gh", "api", endpoint],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(completed.stdout)

          repo = os.environ["REPO"]
          target_ref = os.environ["TARGET_SHA"]
          tree = api_json(f"repos/{repo}/git/trees/{target_ref}?recursive=1")
          if tree.get("truncated") is not False:
              raise SystemExit("target Git tree response was truncated")
          entries = tree.get("tree")
          if not isinstance(entries, list):
              raise SystemExit("target Git tree has no entries")

          manifest_pattern = re.compile(
              r"^engine/crates/[A-Za-z0-9_-]+/Cargo[.]toml$"
          )
          required_paths = {
              "engine/Cargo.lock",
              "engine/Cargo.toml",
              "engine/benches/criterion-benchmarks.txt",
          }
          required_paths.update(
              entry.get("path")
              for entry in entries
              if entry.get("type") == "blob"
              and isinstance(entry.get("path"), str)
              and manifest_pattern.fullmatch(entry["path"])
          )

          identity_root = pathlib.Path("identity")
          for source_path in sorted(required_paths):
              matches = [
                  entry
                  for entry in entries
                  if entry.get("path") == source_path
                  and entry.get("type") == "blob"
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"target tree has no unique blob for {source_path}"
                  )
              entry = matches[0]
              blob = api_json(f"repos/{repo}/git/blobs/{entry['sha']}")
              if blob.get("encoding") != "base64":
                  raise SystemExit(
                      f"target blob is not base64 encoded: {source_path}"
                  )
              encoded = blob.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit(f"target blob has no content: {source_path}")
              try:
                  content = base64.b64decode(
                      "".join(encoded.splitlines()),
                      validate=True,
                  )
              except binascii.Error as error:
                  raise SystemExit(
                      f"target blob is invalid base64: {source_path}"
                  ) from error
              if (
                  blob.get("size") != len(content)
                  or entry.get("size") != len(content)
              ):
                  raise SystemExit(f"target blob size mismatch: {source_path}")
              destination = identity_root / source_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)

          root = pathlib.Path("evidence")
          expected_files = {"micro.json", "real.json"}
          actual_files = set()
          for path in root.rglob("*"):
              relative = path.relative_to(root).as_posix()
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"evidence contains non-file entry: {relative}")
              actual_files.add(relative)
          if actual_files != expected_files:
              raise SystemExit(
                  f"evidence file allowlist mismatch: {sorted(actual_files)}"
              )

          def load_json(path):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError(f"duplicate JSON key {key!r}")
                      result[key] = value
                  return result
              with path.open("r", encoding="utf-8") as stream:
                  return json.load(
                      stream,
                      object_pairs_hook=pairs,
                      parse_constant=lambda value: (_ for _ in ()).throw(
                          ValueError(f"non-finite JSON number {value}")
                      ),
                  )

          def exact_keys(value, keys, label):
              if not isinstance(value, dict) or set(value) != set(keys):
                  raise ValueError(f"{label} keys do not match schema: {sorted(value)}")

          def finite_number(value, label):
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise ValueError(f"{label} is not numeric")
              value = float(value)
              if not math.isfinite(value):
                  raise ValueError(f"{label} is not finite")
              return value

          engine = pathlib.Path("identity/engine")
          workspace_doc = tomllib.loads((engine / "Cargo.toml").read_text("utf-8"))
          members = workspace_doc["workspace"]["members"]
          if (
              not isinstance(members, list)
              or not members
              or len(members) != len(set(members))
              or any(not re.fullmatch(r"crates/[A-Za-z0-9_-]+", item) for item in members)
          ):
              raise ValueError("engine workspace member contract is not exact")
          workspace_version = workspace_doc["workspace"]["package"]["version"]
          if not isinstance(workspace_version, str) or not workspace_version:
              raise ValueError("workspace package version is invalid")
          workspace_packages = {}
          for member in members:
              manifest = tomllib.loads((engine / member / "Cargo.toml").read_text("utf-8"))
              package = manifest["package"]
              name = package["name"]
              if not isinstance(name, str) or not name:
                  raise ValueError(f"invalid workspace package name in {member}")
              version_field = package["version"]
              if isinstance(version_field, dict):
                  if version_field != {"workspace": True}:
                      raise ValueError(
                          f"invalid inherited workspace version in {member}"
                      )
                  version = workspace_version
              else:
                  if not isinstance(version_field, str) or not version_field:
                      raise ValueError(f"invalid workspace version in {member}")
                  version = version_field
              if name in workspace_packages:
                  raise ValueError(f"duplicate workspace package {name}")
              workspace_packages[name] = version

          lock_text = (engine / "Cargo.lock").read_text("utf-8").replace("\r\n", "\n")
          lock_doc = tomllib.loads(lock_text)
          found = set()
          for package in lock_doc.get("package", []):
              name = str(package.get("name", ""))
              if "source" not in package and name in workspace_packages:
                  if str(package.get("version", "")) != workspace_packages[name]:
                      raise ValueError(f"workspace lock version mismatch for {name}")
                  found.add(name)
          if found != set(workspace_packages):
              raise ValueError("Cargo.lock workspace package set is incomplete")
          marker = "[[package]]"
          pieces = lock_text.split(marker)
          canonical = pieces[0]
          for suffix in pieces[1:]:
              block = marker + suffix
              package = tomllib.loads(block)["package"][0]
              name = str(package["name"])
              if "source" not in package and name in workspace_packages:
                  exact = f'version = "{workspace_packages[name]}"'
                  if block.splitlines().count(exact) != 1:
                      raise ValueError(f"non-canonical workspace version line for {name}")
                  block = block.replace(
                      exact, 'version = "<workspace-version>"', 1
                  )
              canonical += block
          for name, version in workspace_packages.items():
              canonical = canonical.replace(
                  f'"{name} {version}"', f'"{name} <workspace-version>"'
              )
          semantic_lock = hashlib.sha256(canonical.encode()).hexdigest()

          target_sha = __import__("os").environ["TARGET_SHA"]
          hex64 = re.compile(r"^[0-9a-f]{64}$")
          counter_keys = {
              "mean_processor_performance",
              "mean_processor_time",
              "min_processor_performance",
              "max_processor_time",
          }

          def validate_measurement(value, kind):
              exact_keys(
                  value,
                  {
                      "schema", "kind", "started_unix", "finished_unix", "git",
                      "cargo_lock_sha256", "rustc", "processor",
                      "logical_processors", "counters",
                  },
                  f"{kind} measurement",
              )
              if (
                  value["schema"] != 1
                  or value["kind"] != f"{kind}-measurement"
                  or not isinstance(value["started_unix"], int)
                  or isinstance(value["started_unix"], bool)
                  or not isinstance(value["finished_unix"], int)
                  or isinstance(value["finished_unix"], bool)
                  or value["started_unix"] <= 0
                  or value["finished_unix"] < value["started_unix"]
              ):
                  raise ValueError(f"{kind} measurement clock/schema is invalid")
              exact_keys(value["git"], {"commit", "dirty", "dirty_sha256"}, "git")
              if (
                  value["git"]["commit"] != target_sha
                  or value["git"]["dirty"] is not False
                  or not isinstance(value["git"]["dirty_sha256"], str)
                  or not hex64.fullmatch(value["git"]["dirty_sha256"])
                  or value["cargo_lock_sha256"] != semantic_lock
                  or not isinstance(value["rustc"], str)
                  or not value["rustc"].startswith("rustc ")
                  or not isinstance(value["processor"], str)
                  or not value["processor"].strip()
                  or value["processor"] == "unknown"
                  or not isinstance(value["logical_processors"], int)
                  or isinstance(value["logical_processors"], bool)
                  or value["logical_processors"] <= 0
              ):
                  raise ValueError(f"{kind} measurement identity is invalid")
              exact_keys(
                  value["counters"], {"preflight", "during", "postflight"}, "counters"
              )
              for phase in ("preflight", "during", "postflight"):
                  counter = value["counters"][phase]
                  exact_keys(counter, counter_keys, f"{kind} {phase} counters")
                  numbers = {
                      key: finite_number(counter[key], f"{kind}.{phase}.{key}")
                      for key in counter_keys
                  }
                  if (
                      numbers["mean_processor_performance"] < 95.0
                      or numbers["min_processor_performance"] <= 0.0
                      or numbers["mean_processor_time"] < 0.0
                      or numbers["max_processor_time"] < 0.0
                      or (
                          phase != "during"
                          and numbers["mean_processor_time"] > 20.0
                      )
                  ):
                      raise ValueError(f"{kind} {phase} counters fail the environment gate")

          common_top_keys = {
              "schema", "kind", "target_sha", "semantic_cargo_lock_sha256",
              "measurement", "expected_cases", "cases", "finite", "passed", "errors",
          }
          micro_ids = sorted(
              line.strip()
              for line in (engine / "benches/criterion-benchmarks.txt")
              .read_text("utf-8")
              .splitlines()
              if line.strip() and not line.strip().startswith("#")
          )
          if not micro_ids or len(micro_ids) != len(set(micro_ids)):
              raise ValueError("micro benchmark manifest is empty or duplicated")
          informational = {"build/finish_1m", "query/regex_scan"}
          queries = [
              "", "e", "a", "win", "Win", "qzx", "ext:dll",
              "size:>100mb path:windows", "*.rs", r"regex:win.*\.dll",
          ]
          real_ids = ["corpus/entries", "index/initial", "memory/ready"]
          for index in range(len(queries)):
              real_ids.extend([f"query/{index:02}/p50", f"query/{index:02}/p99"])
          real_ids.append("snapshot/restore-p50")

          def validate_common(value, kind, expected):
              exact_keys(value, common_top_keys, kind)
              if (
                  value["schema"] != 1
                  or value["kind"] != kind
                  or value["target_sha"] != target_sha
                  or value["semantic_cargo_lock_sha256"] != semantic_lock
                  or value["finite"] is not True
                  or value["passed"] is not True
                  or value["errors"] != []
                  or value["expected_cases"] != expected
                  or not isinstance(value["cases"], list)
                  or len(value["cases"]) != len(expected)
                  or [case.get("id") for case in value["cases"]] != expected
              ):
                  raise ValueError(f"{kind} is not a complete passing decision")
              validate_measurement(value["measurement"], kind)
              return value["cases"]

          micro = load_json(root / "micro.json")
          micro_cases = validate_common(micro, "micro-gate", micro_ids)
          micro_keys = {
              "id", "enforced", "actual", "baseline", "delta", "delta_ratio",
              "delta_ci_lower_ratio", "delta_ci_upper_ratio", "threshold_metric",
              "threshold_value", "verdict",
          }
          for case in micro_cases:
              exact_keys(case, micro_keys, f"micro case {case.get('id')}")
              numbers = {
                  key: finite_number(case[key], f"{case['id']}.{key}")
                  for key in (
                      "actual", "baseline", "delta", "delta_ratio",
                      "delta_ci_lower_ratio", "delta_ci_upper_ratio",
                      "threshold_value",
                  )
              }
              info = case["id"] in informational
              if (
                  case["enforced"] is not (not info)
                  or numbers["actual"] < 0.0
                  or numbers["baseline"] < 0.0
                  or not math.isclose(
                      numbers["delta"],
                      numbers["actual"] - numbers["baseline"],
                      rel_tol=1e-12,
                      abs_tol=1e-6,
                  )
                  or not (
                      numbers["delta_ci_lower_ratio"]
                      <= numbers["delta_ratio"]
                      <= numbers["delta_ci_upper_ratio"]
                  )
                  or case["threshold_metric"] != "delta_ci_lower_ratio"
                  or numbers["threshold_value"] != 0.10
                  or case["verdict"] != ("informational" if info else "pass")
                  or (
                      not info
                      and numbers["delta_ci_lower_ratio"] > numbers["threshold_value"]
                  )
              ):
                  raise ValueError(f"micro case {case['id']} has an invalid verdict")

          real = load_json(root / "real.json")
          real_cases = validate_common(real, "real-gate", real_ids)
          real_keys = {
              "id", "subject", "actual", "baseline", "delta", "delta_ratio",
              "threshold_metric", "threshold_value", "unit", "verdict",
          }
          entries = None
          for index, case in enumerate(real_cases):
              exact_keys(case, real_keys, f"real case {case.get('id')}")
              values = {
                  key: finite_number(case[key], f"{case['id']}.{key}")
                  for key in (
                      "actual", "baseline", "delta", "delta_ratio", "threshold_value"
                  )
              }
              if values["actual"] < 0.0 or values["baseline"] <= 0.0:
                  raise ValueError(f"real case {case['id']} has invalid measurements")
              if (
                  not math.isclose(
                      values["delta"],
                      values["actual"] - values["baseline"],
                      rel_tol=1e-12,
                      abs_tol=1e-6,
                  )
                  or not math.isclose(
                      values["delta_ratio"],
                      values["delta"] / values["baseline"],
                      rel_tol=1e-12,
                      abs_tol=1e-12,
                  )
                  or case["verdict"] != "pass"
              ):
                  raise ValueError(f"real case {case['id']} has inconsistent arithmetic")
              case_id = case["id"]
              if case_id == "corpus/entries":
                  integral = (
                      values["actual"].is_integer()
                      and values["baseline"].is_integer()
                      and values["actual"] > 0.0
                  )
                  entries = int(values["actual"])
                  valid = (
                      integral
                      and case["subject"] == "C:"
                      and case["threshold_metric"] == "absolute_delta_ratio"
                      and values["threshold_value"] == 0.10
                      and abs(values["delta_ratio"]) <= 0.10
                      and case["unit"] == "entries"
                  )
              elif case_id == "index/initial":
                  if entries is None:
                      raise ValueError("index case appeared before corpus identity")
                  budget = (
                      8_000
                      if entries <= 250_000
                      else 8_000 + ((entries - 250_000) * 52_000) // 750_000
                  )
                  valid = (
                      values["actual"].is_integer()
                      and values["baseline"].is_integer()
                      and values["actual"] > 0.0
                      and case["subject"] == "C:"
                      and case["threshold_metric"] == "actual"
                      and values["threshold_value"] == float(budget)
                      and values["actual"] <= values["threshold_value"]
                      and case["unit"] == "milliseconds"
                  )
              elif case_id == "memory/ready":
                  valid = (
                      case["subject"] == "C:"
                      and case["threshold_metric"] == "actual"
                      and values["threshold_value"] == 110.0
                      and values["actual"] <= 110.0
                      and case["unit"] == "bytes_per_entry"
                  )
              elif case_id == "snapshot/restore-p50":
                  valid = (
                      values["actual"].is_integer()
                      and values["baseline"].is_integer()
                      and values["actual"] > 0.0
                      and case["subject"] == "C:"
                      and case["threshold_metric"] == "actual"
                      and values["threshold_value"] == 1_000.0
                      and values["actual"] <= 1_000.0
                      and case["unit"] == "milliseconds"
                  )
              else:
                  match = re.fullmatch(r"query/([0-9]{2})/(p50|p99)", case_id)
                  if match is None:
                      raise ValueError(f"unknown real case {case_id}")
                  query_index = int(match.group(1))
                  metric = match.group(2)
                  expected_threshold = (
                      max(values["baseline"], 200.0) * 1.5
                      if metric == "p50"
                      else 50_000.0
                  )
                  valid = (
                      query_index < len(queries)
                      and values["actual"].is_integer()
                      and values["baseline"].is_integer()
                      and case["subject"] == queries[query_index]
                      and case["threshold_metric"] == "actual"
                      and values["threshold_value"] == expected_threshold
                      and values["actual"] <= expected_threshold
                      and case["unit"] == "microseconds"
                  )
              if not valid:
                  raise ValueError(f"real case {case_id} has an invalid threshold/verdict")

          print(f"validated micro+real evidence for {target_sha} / {semantic_lock}")

  release:
    needs: authorize-release
    if: ${{ needs.authorize-release.outputs.release_needed == 'true' }}
    permissions:
      actions: read # let the reusable release workflow bind trusted artifacts
      attestations: write # publish release provenance for validated artifacts
      contents: read # build and publish only the authorized tagged source
      id-token: write # obtain keyless signing identity for release provenance
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.authorize-release.outputs.tag_name }}
      commit_sha: ${{ needs.authorize-release.outputs.commit_sha }}
      performance_run_id: ${{ needs.authorize-release.outputs.performance_run_id }}
      release_id: ${{ needs.authorize-release.outputs.release_id }}
      publish: true
