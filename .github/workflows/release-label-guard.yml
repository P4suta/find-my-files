# release-please tracks its Release PR by the `autorelease: pending` label and,
# after merge, finds the merged PR carrying it to cut the tag + GitHub Release
# (relabelling it `autorelease: tagged`). Strip that label and the release would
# silently never be cut. GitHub has no per-label lock, so instead: if anyone
# removes `autorelease: pending` from a release-please PR, put it straight back.
#
# The `issues` label event runs the default-branch definition for both issues and
# pull requests, so this API-only guard needs no `pull_request_target`. It first
# filters for a PR event, then fetches current PR state and requires the exact
# same-repository bot branch before writing. The human approval label
# `release: approved` is deliberately NOT guarded: removing it (un-approving) is
# a legitimate act (ADR-0035).
name: release-label-guard

on:
  issues:
    types: [unlabeled]

permissions: {}

concurrency:
  group: release-label-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reinstate:
    # Ignore ordinary issues and every label except release-please's tracking
    # label before allocating a runner. Current branch/repository identity is
    # checked via the API immediately before the mutation.
    if: >-
      github.event.issue.pull_request != null
      && github.event.issue.state == 'open'
      && github.event.label.name == 'autorelease: pending'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # restore the protected autorelease label
    steps:
      - name: Reinstate release-please's tracking label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid pull request number"
            exit 1
          fi
          current=$(gh api "repos/$REPO/pulls/$PR")
          if [ "$(jq -r '.state' <<<"$current")" != "open" ] ||
             [ "$(jq -r '.base.repo.full_name' <<<"$current")" != "$REPO" ] ||
             [ "$(jq -r '.base.ref' <<<"$current")" != "main" ] ||
             [ "$(jq -r '.head.repo.full_name // \"\"' <<<"$current")" != "$REPO" ] ||
             [ "$(jq -r '.head.ref' <<<"$current")" != "release-please--branches--main--components--find-my-files" ]; then
            echo "PR #$PR is not the open same-repository Release PR; no label mutation."
            exit 0
          fi

          gh pr edit "$PR" --repo "$REPO" --add-label "autorelease: pending"
          gh pr comment "$PR" --repo "$REPO" --body \
            "🔒 Restored the \`autorelease: pending\` label — release-please needs it to cut the \`vX.Y.Z\` tag and Release after merge; removing it would silently skip the release (ADR-0035). To stop a release, just don't merge (or remove \`release: approved\`)."
