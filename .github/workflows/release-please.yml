
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Recovery only: re-dispatch release.yml for an existing vX.Y.Z draft"
        required: false
        type: string

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-please
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
      pr_branch: ${{ steps.rp_branch.outputs.branch }}
    permissions:
      id-token: write # Permission: Authenticate the scoped Doppler identity.
    env:
      RUN_BOT: ${{ github.event_name == 'push' || inputs.tag_name == '' }}
    steps:
      - name: Fetch automation credentials
        id: doppler
        if: "env.RUN_BOT == 'true'"
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: find-my-files
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler.outcome == 'success' && (
          steps.doppler.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Require complete Doppler credentials
        if: env.RUN_BOT == 'true'
        shell: bash
        env:
          RELEASE_PLEASE_CLIENT_ID: ${{ steps.doppler.outputs.GITHUB_APP_CLIENT_ID }}
          RELEASE_PLEASE_PRIVATE_KEY: ${{ steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in RELEASE_PLEASE_CLIENT_ID RELEASE_PLEASE_PRIVATE_KEY; do
            if [[ -z "${!name}" || "${!name}" =~ ^\$\{[^}]+\}$ ]]; then
              echo "::error::$name is empty or contains an unresolved Doppler reference."
              exit 1
            fi
          done

      - name: Mint GitHub App token
        id: app-token
        if: env.RUN_BOT == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: release-please (active)
        id: rp
        if: env.RUN_BOT == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve the Release PR branch
        id: rp_branch
        if: ${{ env.RUN_BOT == 'true' && steps.rp.outputs.pr != '' }}
        env:
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: echo "branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')" >> "$GITHUB_OUTPUT"

  sync-release-lock:
    name: sync-release-lock
    needs: release-please
    if: >-
      ${{
        needs.release-please.result == 'success' &&
        needs.release-please.outputs.pr_branch != ''
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Check out the mutable Release PR branch without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Pin the checked-out Release PR head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid Release PR head '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Rust only to calculate Cargo.lock
        uses: $/.github/actions/rust-toolchain

      - name: Calculate Cargo.lock for the bumped workspace version
        shell: bash
        run: cargo update --workspace --manifest-path engine/Cargo.toml

      - name: Stage the single-file write candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-lock
          cp engine/Cargo.lock build/release-lock/Cargo.lock

      - name: Upload the lockfile candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-lock-candidate
          path: build/release-lock/Cargo.lock
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  commit-release-lock:
    name: commit-release-lock
    needs: [release-please, sync-release-lock]
    if: >-
      ${{
        always() &&
        needs.release-please.result == 'success' &&
        needs.sync-release-lock.result == 'success' &&
        needs.release-please.outputs.pr_branch != ''
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release-please
    permissions:
      id-token: write # Permission: Authenticate the scoped Doppler identity.
    steps:
      - name: Download the lockfile candidate before minting write authority
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-lock-candidate
          path: build/release-lock

      - name: Fetch automation credentials
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: find-my-files
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler.outcome == 'success' && (
          steps.doppler.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Require complete Doppler credentials
        shell: bash
        env:
          RELEASE_PLEASE_CLIENT_ID: ${{ steps.doppler.outputs.GITHUB_APP_CLIENT_ID }}
          RELEASE_PLEASE_PRIVATE_KEY: ${{ steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in RELEASE_PLEASE_CLIENT_ID RELEASE_PLEASE_PRIVATE_KEY; do
            if [[ -z "${!name}" || "${!name}" =~ ^\$\{[^}]+\}$ ]]; then
              echo "::error::$name is empty or contains an unresolved Doppler reference."
              exit 1
            fi
          done

      - name: Mint short-lived App token for the atomic commit
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit only Cargo.lock with an atomic branch-head guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          EXPECTED_HEAD: ${{ needs.sync-release-lock.outputs.head_sha }}
          LOCK_PATH: build/release-lock/Cargo.lock
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require("fs");
            const branch = process.env.BRANCH;
            const expectedHead = process.env.EXPECTED_HEAD;
            const lockPath = process.env.LOCK_PATH;

            if (branch !== "release-please--branches--main--components--find-my-files") {
              core.setFailed(`refusing unexpected release-please branch '${branch}'`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHead)) {
              core.setFailed(`invalid expected head '${expectedHead}'`);
              return;
            }

            const stat = fs.lstatSync(lockPath);
            if (!stat.isFile() || stat.size === 0 || stat.size > 10 * 1024 * 1024) {
              core.setFailed(`invalid Cargo.lock candidate (${stat.size} bytes)`);
              return;
            }
            const candidate = fs.readFileSync(lockPath);
            const currentRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            if (currentRef.data.object.sha !== expectedHead) {
              core.setFailed(
                `Release PR head moved from ${expectedHead} to ${currentRef.data.object.sha}; retry`,
              );
              return;
            }
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "engine/Cargo.lock",
              ref: expectedHead,
            });
            if (Array.isArray(current.data) || current.data.type !== "file") {
              core.setFailed("engine/Cargo.lock is not a file at the expected head");
              return;
            }
            const existing = Buffer.from(
              current.data.content.replace(/\s/g, ""),
              "base64",
            );
            if (candidate.equals(existing)) {
              core.info("Cargo.lock already matches the calculated candidate.");
              return;
            }

            const mutation = `
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }
            `;
            const result = await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName: branch,
                },
                message: {
                  headline: "chore: sync Cargo.lock to the release version",
                },
                fileChanges: {
                  additions: [{
                    path: "engine/Cargo.lock",
                    contents: candidate.toString("base64"),
                  }],
                },
                expectedHeadOid: expectedHead,
              },
            });
            core.info(
              `Committed Cargo.lock as ${result.createCommitOnBranch.commit.oid}`,
            );

  dispatch-release:
    name: dispatch-release
    needs: release-please
    if: >-
      ${{
        needs.release-please.result == 'success' &&
        github.ref == 'refs/heads/main' &&
        (
          needs.release-please.outputs.release_created == 'true' ||
          inputs.tag_name != ''
        )
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # Permission: Dispatch publication for the verified release tag.
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
      EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
      CREATED_UPLOAD_URL: ${{ needs.release-please.outputs.upload_url }}
    steps:
      - name: Resolve the exact draft identity
        id: draft
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release dispatch requires an exact vX.Y.Z tag, got '$TAG'"
            exit 1
          fi

          tag_sha=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')
          if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$TAG did not resolve to an immutable commit SHA"
            exit 1
          fi
          if [ -n "$EXPECTED_SHA" ] && [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::release-please SHA $EXPECTED_SHA does not match $TAG ($tag_sha)"
            exit 1
          fi
          lineage=$(gh api "repos/$REPO/compare/$tag_sha...main" --jq '.status')
          if [ "$lineage" != "ahead" ] && [ "$lineage" != "identical" ]; then
            echo "::error::$TAG is not on main's protected lineage (compare status: $lineage)"
            exit 1
          fi

          # Normal cuts bind directly to release-please's documented upload_url
          # output. Only the explicit recovery path may resolve a draft by listing
          # releases, and it does so once before fixing the numeric database ID.
          if [ -n "$CREATED_UPLOAD_URL" ]; then
            upload_prefix="https://uploads.github.com/repos/$REPO/releases/"
            upload_suffix='/assets{?name,label}'
            if [[ "$CREATED_UPLOAD_URL" != "$upload_prefix"*"$upload_suffix" ]]; then
              echo "::error::release-please returned an unexpected upload_url"
              exit 1
            fi
            release_id=${CREATED_UPLOAD_URL#"$upload_prefix"}
            release_id=${release_id%"$upload_suffix"}
          else
            if [ -n "$EXPECTED_SHA" ]; then
              echo "::error::a newly created release has no release-please upload_url"
              exit 1
            fi
            release_pages=$(gh api --paginate "repos/$REPO/releases?per_page=100")
            release_matches=$(jq -s --arg tag "$TAG" --arg sha "$tag_sha" '
              add |
              map(select(
                .draft == true and
                .prerelease == false and
                .tag_name == $tag and
                .name == $tag and
                .target_commitish == $sha
              ))
            ' <<<"$release_pages")
            if [ "$(jq 'length' <<<"$release_matches")" -ne 1 ]; then
              echo "::error::recovery requires exactly one matching draft release"
              exit 1
            fi
            release_id=$(jq -r '.[0].id' <<<"$release_matches")
          fi
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::draft has no exact numeric release ID"
            exit 1
          fi

          release_json=$(gh api "repos/$REPO/releases/$release_id")
          if [ "$(jq -r '.id | tostring' <<<"$release_json")" != "$release_id" ] ||
             [ "$(jq -r '.draft' <<<"$release_json")" != "true" ] ||
             [ "$(jq -r '.prerelease' <<<"$release_json")" != "false" ] ||
             [ "$(jq -r '.tag_name' <<<"$release_json")" != "$TAG" ] ||
             [ "$(jq -r '.name' <<<"$release_json")" != "$TAG" ]; then
            echo "::error::release $release_id is not the exact expected draft"
            exit 1
          fi

          target=$(jq -r '.target_commitish' <<<"$release_json")
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]] || [ "$target" != "$tag_sha" ]; then
            echo "::error::draft target $target must be the exact $TAG commit $tag_sha, not a mutable ref"
            exit 1
          fi
          {
            echo "tag_sha=$tag_sha"
            echo "release_id=$release_id"
          } >>"$GITHUB_OUTPUT"

      - name: Revalidate, deduplicate, and dispatch the trusted release
        shell: bash
        env:
          TAG_SHA: ${{ steps.draft.outputs.tag_sha }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::resolved draft identity outputs are invalid"
            exit 1
          fi
          live_tag_sha=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')
          release_json=$(gh api "repos/$REPO/releases/$RELEASE_ID")
          if [ "$live_tag_sha" != "$TAG_SHA" ] ||
             [ "$(jq -r '.id | tostring' <<<"$release_json")" != "$RELEASE_ID" ] ||
             [ "$(jq -r '.draft' <<<"$release_json")" != "true" ] ||
             [ "$(jq -r '.prerelease' <<<"$release_json")" != "false" ] ||
             [ "$(jq -r '.tag_name' <<<"$release_json")" != "$TAG" ] ||
             [ "$(jq -r '.name' <<<"$release_json")" != "$TAG" ] ||
             [ "$(jq -r '.target_commitish' <<<"$release_json")" != "$TAG_SHA" ]; then
            echo "::error::exact draft identity changed before dispatch"
            exit 1
          fi

          tag_sha=$TAG_SHA
          release_id=$RELEASE_ID
          # release.yml's `run-name:` renders exactly this string, so a run that
          # already owns this tag/commit/release triple is visible by title alone.
          # In-flight and successful runs both block a second dispatch; only a
          # failed one may be re-dispatched (or re-run from the Actions UI).
          release_title="release publish $TAG $tag_sha release $release_id"
          release_runs=$(gh run list --repo "$REPO" --workflow release.yml \
            --branch main --event workflow_dispatch --limit 50 \
            --json displayTitle,status,conclusion,databaseId)
          existing_release=$(jq -r --arg title "$release_title" '
            .[] |
            select(.displayTitle == $title) |
            select(.status != "completed" or .conclusion == "success") |
            .databaseId
          ' <<<"$release_runs" | head -n 1)
          if [ -n "$existing_release" ]; then
            echo "Release run $existing_release already owns release $release_id — no duplicate dispatch."
            exit 0
          fi

          gh workflow run release.yml --repo "$REPO" --ref main \
            -f tag_name="$TAG" -f commit_sha="$tag_sha" -f release_id="$release_id"
