name: sbom-monitor

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-monitor
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      scan: ${{ steps.fetch.outputs.scan }}
      tag: ${{ steps.fetch.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate latest release + download its SBOMs
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release=$(jq -c '[.[] | select(.draft == false and .prerelease == false)][0] // empty' <<<"$releases")
          if [ -z "$release" ]; then
            echo "::notice::No published release yet — nothing to re-scan (dormant)."
            echo "scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag=$(jq -r '.tag_name' <<<"$release")
          if [ "$(jq -r '.immutable' <<<"$release")" != "true" ]; then
            echo "::error::Latest stable release $tag is not immutable."
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest stable release has a non-canonical tag '$tag'."
            exit 1
          fi
          mapfile -t actual < <(
            jq -r '.assets[].name | select(endswith(".cdx.json"))' <<<"$release" |
              sort
          )
          expected=("app.cdx.json" "fmf-engine.cdx.json")
          if [ "${actual[*]-}" != "${expected[*]}" ]; then
            echo "::error::Release $tag must contain exactly: ${expected[*]}; found: ${actual[*]-<none>}"
            exit 1
          fi

          mkdir -p sbom
          for name in "${expected[@]}"; do
            gh release download "$tag" --pattern "$name" --dir sbom
            expected_digest=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")
            if [[ ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Release asset $name has no valid GitHub sha256 digest."
              exit 1
            fi
            actual_digest="sha256:$(sha256sum "sbom/$name" | cut -d ' ' -f 1)"
            if [ "$actual_digest" != "$expected_digest" ]; then
              echo "::error::Downloaded $name digest $actual_digest does not match release metadata $expected_digest."
              exit 1
            fi
          done

          echo "Located $tag and verified both SBOM asset digests against release metadata."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "scan=true" >> "$GITHUB_OUTPUT"

      - name: Validate the downloaded SBOM pair
        if: steps.fetch.outputs.scan == 'true'
        shell: bash
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version=${tag#v}
          expected=("app.cdx.json" "fmf-engine.cdx.json")
          for name in "${expected[@]}"; do
            path="sbom/$name"
            case "$name" in
              app.cdx.json) root="FindMyFiles" ;;
              fmf-engine.cdx.json) root="fmf-engine" ;;
              *)
                echo "::error::No expected root component is defined for $name."
                exit 1
                ;;
            esac

            # A `jq` process failure (unparseable bytes, a `metadata.component`
            # that is not an object) is the same "died without saying why"
            # defect as a false predicate, so its stderr is captured, not lost.
            if ! facts=$(jq -r '
              [
                (.bomFormat // "null"),
                (.specVersion // "null"),
                (if (.components | type) == "array" then (.components | length) else "not-an-array" end),
                (.metadata.component.type // "null"),
                (.metadata.component.name // "null"),
                (.metadata.component.version // "null"),
                (.metadata.component["bom-ref"] // "null")
              ] | map(tostring) | join("\u001f")
            ' "$path" 2>&1); then
              echo "::error::$path could not be read as CycloneDX JSON."
              echo "  jq: $facts"
              exit 1
            fi
            # \x1f, not \t. Tab is IFS *whitespace*, so bash folds a run of tabs
            # into one delimiter and every field after an empty one shifts left —
            # and `// "null"` does not prevent that, since only null and false are
            # falsy in jq (`"" // "null"` is `""`). A drifted SBOM is exactly
            # where an empty field turns up, so a tab here would make the
            # expected/actual line misreport the very drift it exists to show.
            IFS=$'\037' read -r bom_format spec_version components \
              root_type root_name root_version root_ref <<<"$facts"

            # Unconditional for every release, forever (rationale above step).
            if [ "$bom_format" != "CycloneDX" ] || [ "$spec_version" != "1.6" ] ||
              [ "$components" = "not-an-array" ] || [ "$components" = "0" ]; then
              echo "::error::$path failed SBOM structure validation."
              echo "  expected: bomFormat=CycloneDX specVersion=1.6 components=<non-empty array>"
              echo "  actual:   bomFormat=$bom_format specVersion=$spec_version components=$components"
              exit 1
            fi

            # Strict for every release but one file of one immutable release.
            # Reason, expiry and the security argument are above this step; the
            # short version is that v0.1.1's engine SBOM predates #164 and its
            # bytes can never be corrected, while its digest and structure are
            # verified unwaived.
            expected_identity="type=application name=$root version=$version bom-ref=$root@$version"
            actual_identity="type=$root_type name=$root_name version=$root_version bom-ref=$root_ref"
            if [ "$actual_identity" != "$expected_identity" ]; then
              if [ "$tag" = "v0.1.1" ] && [ "$name" = "fmf-engine.cdx.json" ]; then
                echo "::notice::$path identity waived for $tag: shipped before #164 standardized metadata.component, and $tag is immutable. Digest and structure were verified."
                echo "  expected: $expected_identity"
                echo "  actual:   $actual_identity"
              else
                echo "::error::$path failed SBOM identity validation for $tag."
                echo "  expected: $expected_identity"
                echo "  actual:   $actual_identity"
                exit 1
              fi
            fi
          done

          echo "Validated SBOM structure and product identity for $tag."

      - name: Hand validated SBOMs to the isolated scanner
        if: steps.fetch.outputs.scan == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-monitor-input
          path: |
            sbom/app.cdx.json
            sbom/fmf-engine.cdx.json
            osv-scanner.toml
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  scan:
    needs: prepare
    if: >-
      ${{
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.scan == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Permission: Download the validated SBOM handoff.
    outputs:
      code: ${{ steps.scan.outputs.code }}
    steps:
      - name: Download validated SBOMs and policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-monitor-input

      - name: Install osv-scanner
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: osv-scanner@2.3.6
          fallback: none

      - name: Re-scan release SBOMs against today's OSV DB
        id: scan
        shell: bash
        run: |
          # Scan both canonical SBOMs (-L detects CycloneDX by the .cdx.json name).
          # Capture without tripping `set -e` so the next step can update the
          # tracking issue before it fails the run. Only 0 (clean) and 1
          # (findings) are semantic results; every other code is a scanner error
          # and must fail closed.
          code=0
          osv-scanner scan source \
            -L sbom/fmf-engine.cdx.json \
            -L sbom/app.cdx.json \
            --config osv-scanner.toml \
            --format markdown --output osv-report.md || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "osv-scanner exit code: $code"

      - name: Upload vulnerability report
        if: steps.scan.outputs.code == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-monitor-report
          path: osv-report.md
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  report:
    needs: [prepare, scan]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.scan == 'true' &&
        needs.scan.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Permission: Download the scanner report.
      issues: write # Permission: Maintain the vulnerability tracking issue.
    steps:
      - name: Download vulnerability report
        if: needs.scan.outputs.code == '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-monitor-report

      - name: Open / update / close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CODE: ${{ needs.scan.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create sbom-vuln --color B60205 --force \
            --description "Vulnerability found in a shipped release's SBOM (sbom-monitor.yml)"
          mapfile -t existing < <(
            gh issue list --label sbom-vuln --state open --limit 100 \
              --json number --jq '.[].number'
          )

          if [ "$CODE" = "1" ]; then
            {
              echo "## 🛡️ Vulnerability in a shipped release ($TAG)"
              echo
              echo "osv-scanner found known vulnerabilities in the SBOM attached to release **$TAG** — the binary users have already downloaded. Source-tree scanners (cargo-audit / Dependabot) don't cover shipped artifacts; this is that gap (ADR-0034)."
              echo
              echo "- Re-scan run: $RUN_URL"
              echo "- Fix: bump the affected dependency and cut a patch release, or record an accepted/unfixable advisory in \`osv-scanner.toml\`."
              echo
              echo "<details><summary>osv-scanner report</summary>"
              echo
              cat osv-report.md
              echo
              echo "</details>"
            } > issue-body.md
            if [ "${#existing[@]}" -gt 0 ]; then
              primary=${existing[0]}
              gh issue edit "$primary" --body-file issue-body.md
              echo "Updated issue #$primary."
              for duplicate in "${existing[@]:1}"; do
                gh issue comment "$duplicate" \
                  --body "Superseded by the canonical tracking issue #$primary. Closing."
                gh issue close "$duplicate"
              done
            else
              gh issue create --title "Vulnerable dependency in shipped release $TAG" \
                --label sbom-vuln --body-file issue-body.md
            fi
            echo "::error::Known vulnerabilities remain in the shipped release $TAG."
            exit 1
          elif [ "$CODE" = "0" ]; then
            for issue in "${existing[@]}"; do
              gh issue comment "$issue" --body "Latest release ($TAG) SBOM is clean as of $RUN_URL. Closing."
              gh issue close "$issue"
            done
            echo "No vulnerabilities in $TAG."
          else
            echo "::error::osv-scanner exited unexpectedly with code $CODE."
            exit 1
          fi
