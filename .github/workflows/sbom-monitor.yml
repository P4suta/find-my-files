# Re-scans the SBOM of the LATEST published release against today's OSV.dev DB.
#
# This is the one supply-chain check that looks at *what we already shipped*,
# not the current source tree: cargo-audit / cargo-deny / Dependabot all scan
# HEAD, so a CVE disclosed *after* a release goes unnoticed for the binary users
# already have. The release's frozen CycloneDX SBOM assets are exactly the
# manifest needed to answer "is the shipped v1.0 affected?" — so the SBOM finally
# does work here instead of being a write-only release artifact (ADR-0034).
#
# Dormant only until the first published release. Once any release exists, both
# canonical SBOM assets, their release digests and their CycloneDX structure are
# mandatory; the one narrow product-identity waiver is documented at the check
# that applies it.
name: sbom-monitor

on:
  schedule:
    - cron: "7 5 * * 1" # weekly Mon 05:07 UTC (offset from cargo-audit/codeql/scorecard crons)
  workflow_dispatch:

permissions: {}

# Serialize scheduled/manual rescans so two report jobs cannot race and create
# duplicate tracking issues for the same shipped release.
concurrency:
  group: sbom-monitor
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read releases + download SBOM assets
    outputs:
      scan: ${{ steps.fetch.outputs.scan }}
      tag: ${{ steps.fetch.outputs.tag }}
    steps:
      # Checkout is only for osv-scanner.toml (the accepted-advisory ignore
      # list). The main-only guard above makes manual feature-branch runs inert;
      # retain the event SHA for an auditable policy snapshot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate latest release + download its SBOMs
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release=$(jq -c '[.[] | select(.draft == false and .prerelease == false)][0] // empty' <<<"$releases")
          if [ -z "$release" ]; then
            echo "::notice::No published release yet — nothing to re-scan (dormant)."
            echo "scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag=$(jq -r '.tag_name' <<<"$release")
          if [ "$(jq -r '.immutable' <<<"$release")" != "true" ]; then
            echo "::error::Latest stable release $tag is not immutable."
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest stable release has a non-canonical tag '$tag'."
            exit 1
          fi
          mapfile -t actual < <(
            jq -r '.assets[].name | select(endswith(".cdx.json"))' <<<"$release" |
              sort
          )
          expected=("app.cdx.json" "fmf-engine.cdx.json")
          if [ "${actual[*]-}" != "${expected[*]}" ]; then
            echo "::error::Release $tag must contain exactly: ${expected[*]}; found: ${actual[*]-<none>}"
            exit 1
          fi

          mkdir -p sbom
          for name in "${expected[@]}"; do
            gh release download "$tag" --pattern "$name" --dir sbom
            expected_digest=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")
            if [[ ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Release asset $name has no valid GitHub sha256 digest."
              exit 1
            fi
            actual_digest="sha256:$(sha256sum "sbom/$name" | cut -d ' ' -f 1)"
            if [ "$actual_digest" != "$expected_digest" ]; then
              echo "::error::Downloaded $name digest $actual_digest does not match release metadata $expected_digest."
              exit 1
            fi
          done

          echo "Located $tag and verified both SBOM asset digests against release metadata."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "scan=true" >> "$GITHUB_OUTPUT"

      # Reading the SBOMs is a separate step from fetching them for two reasons.
      #
      # The first is the point of this file: a named step tells the run log which
      # half failed before anyone reads a message. Downloading the wrong bytes and
      # shipping an SBOM whose shape drifted are different problems with different
      # fixes, and they now fail under different headings.
      #
      # The second is mechanical and load-bearing, so do not merge these back
      # together. `actionlint` pipes each bash `run:` body to `shellcheck` on
      # stdin, and on Windows that anonymous pipe holds 4096 bytes: a bash script
      # of 4050 bytes lints in 130 ms, one of 4090 bytes deadlocks forever with no
      # output at all. The limit is per `run:` block, not per workflow (two 3 KB
      # steps are fine; one 6 KB step is not), and `pwsh` blocks are exempt only
      # because shellcheck never sees them. `just lint` is a required gate, so a
      # step over that line hangs the local loop with no diagnostic — the same
      # class of silent failure this commit exists to remove. Keeping the long
      # prose here at YAML level rather than inside `run: |` is part of that
      # budget: comments outside the block scalar are not part of the script.
      #
      # What the validation itself is for, and why exactly one thing is waived:
      #
      # This block used to be five `jq -e '...' "$path" >/dev/null` calls. `jq -e`
      # answers a false predicate with exit status 1 and the single word `false`
      # on stdout — which `>/dev/null` discarded — so `set -e` killed the step
      # leaving `##[error]Process completed with exit code 1.` as the entire
      # record of what had gone wrong. This monitor was red for six consecutive
      # weeks (2026-08-03 through 2026-09-07, last green 2026-07-27) and no run
      # log ever named the file, the field, or the value. Every other check here
      # already used `if ...; then echo "::error::..."; exit 1; fi`; the `jq -e`
      # calls were the one shape that could fail anonymously, and they are the
      # ones that failed. Facts are now read once per file and compared as
      # rendered strings, so the diagnostic falls out of the comparison instead of
      # being something a future edit has to remember to add.
      #
      # Structure (`bomFormat` / `specVersion` / a non-empty `.components`) and
      # the asset digests verified in the previous step apply to every release,
      # forever. `.components` is the array osv-scanner actually reads, so an SBOM
      # failing there carries no usable vulnerability data and scanning it would
      # be theatre. Product identity is strict too, with one waiver, recorded in
      # the `osv-scanner.toml` style — why it cannot be fixed, and when it stops
      # applying:
      #
      # reason: v0.1.1's `fmf-engine.cdx.json` shipped as `type=application
      #   name=engine version=null bom-ref=null`. It predates PR #164, which
      #   standardized `metadata.component` identity; `xtask/src/sbom.rs` now
      #   requires name/version/bom-ref on the root component, so no release from
      #   v0.2.0 on can reproduce that shape. v0.1.1 is an immutable release, so
      #   those bytes cannot be corrected after the fact and the strict
      #   comparison can never pass against them.
      # revisit after: nothing to schedule. The waiver is literal tag equality, so
      #   the strict path resumes by itself the moment v0.2.0 becomes the latest
      #   stable release. If this branch is still reachable then, the
      #   `[ "$tag" = "v0.1.1" ]` test is dead code — delete it.
      #
      # Waiving it is not a security regression. The digest check binds these
      # exact bytes to the release metadata GitHub serves, so "we downloaded the
      # right file" is settled before validation starts, and structure is checked
      # unwaived. `metadata.component` is provenance labelling that carries no
      # vulnerability data. Hard failing on a cosmetic label is precisely what
      # switched off the only check we have on already-shipped binaries for six
      # weeks (ADR-0034).
      #
      # v0.1.0 is deliberately not named in the shell. It published zero assets,
      # so the asset-name check in the previous step rejects it with its own
      # `::error::` long before validation; naming it here would falsely imply it
      # reaches identity validation at all.
      - name: Validate the downloaded SBOM pair
        if: steps.fetch.outputs.scan == 'true'
        shell: bash
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version=${tag#v}
          expected=("app.cdx.json" "fmf-engine.cdx.json")
          for name in "${expected[@]}"; do
            path="sbom/$name"
            case "$name" in
              app.cdx.json) root="FindMyFiles" ;;
              fmf-engine.cdx.json) root="fmf-engine" ;;
              *)
                echo "::error::No expected root component is defined for $name."
                exit 1
                ;;
            esac

            # A `jq` process failure (unparseable bytes, a `metadata.component`
            # that is not an object) is the same "died without saying why"
            # defect as a false predicate, so its stderr is captured, not lost.
            if ! facts=$(jq -r '
              [
                (.bomFormat // "null"),
                (.specVersion // "null"),
                (if (.components | type) == "array" then (.components | length) else "not-an-array" end),
                (.metadata.component.type // "null"),
                (.metadata.component.name // "null"),
                (.metadata.component.version // "null"),
                (.metadata.component["bom-ref"] // "null")
              ] | map(tostring) | join("\u001f")
            ' "$path" 2>&1); then
              echo "::error::$path could not be read as CycloneDX JSON."
              echo "  jq: $facts"
              exit 1
            fi
            # \x1f, not \t. Tab is IFS *whitespace*, so bash folds a run of tabs
            # into one delimiter and every field after an empty one shifts left —
            # and `// "null"` does not prevent that, since only null and false are
            # falsy in jq (`"" // "null"` is `""`). A drifted SBOM is exactly
            # where an empty field turns up, so a tab here would make the
            # expected/actual line misreport the very drift it exists to show.
            IFS=$'\037' read -r bom_format spec_version components \
              root_type root_name root_version root_ref <<<"$facts"

            # Unconditional for every release, forever (rationale above step).
            if [ "$bom_format" != "CycloneDX" ] || [ "$spec_version" != "1.6" ] ||
              [ "$components" = "not-an-array" ] || [ "$components" = "0" ]; then
              echo "::error::$path failed SBOM structure validation."
              echo "  expected: bomFormat=CycloneDX specVersion=1.6 components=<non-empty array>"
              echo "  actual:   bomFormat=$bom_format specVersion=$spec_version components=$components"
              exit 1
            fi

            # Strict for every release but one file of one immutable release.
            # Reason, expiry and the security argument are above this step; the
            # short version is that v0.1.1's engine SBOM predates #164 and its
            # bytes can never be corrected, while its digest and structure are
            # verified unwaived.
            expected_identity="type=application name=$root version=$version bom-ref=$root@$version"
            actual_identity="type=$root_type name=$root_name version=$root_version bom-ref=$root_ref"
            if [ "$actual_identity" != "$expected_identity" ]; then
              if [ "$tag" = "v0.1.1" ] && [ "$name" = "fmf-engine.cdx.json" ]; then
                echo "::notice::$path identity waived for $tag: shipped before #164 standardized metadata.component, and $tag is immutable. Digest and structure were verified."
                echo "  expected: $expected_identity"
                echo "  actual:   $actual_identity"
              else
                echo "::error::$path failed SBOM identity validation for $tag."
                echo "  expected: $expected_identity"
                echo "  actual:   $actual_identity"
                exit 1
              fi
            fi
          done

          echo "Validated SBOM structure and product identity for $tag."

      - name: Hand validated SBOMs to the isolated scanner
        if: steps.fetch.outputs.scan == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-monitor-input
          path: |
            sbom/app.cdx.json
            sbom/fmf-engine.cdx.json
            osv-scanner.toml
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # The third-party scanner gets only read access to this run's validated
  # artifact. It cannot read repository contents/releases or mutate issues.
  scan:
    needs: prepare
    if: >-
      ${{
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.scan == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # download the validated SBOM handoff artifact
    outputs:
      code: ${{ steps.scan.outputs.code }}
    steps:
      - name: Download validated SBOMs and policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-monitor-input

      - name: Install osv-scanner
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: osv-scanner@2.3.6
          fallback: none

      - name: Re-scan release SBOMs against today's OSV DB
        id: scan
        shell: bash
        run: |
          # Scan both canonical SBOMs (-L detects CycloneDX by the .cdx.json name).
          # Capture without tripping `set -e` so the next step can update the
          # tracking issue before it fails the run. Only 0 (clean) and 1
          # (findings) are semantic results; every other code is a scanner error
          # and must fail closed.
          code=0
          osv-scanner scan source \
            -L sbom/fmf-engine.cdx.json \
            -L sbom/app.cdx.json \
            --config osv-scanner.toml \
            --format markdown --output osv-report.md || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "osv-scanner exit code: $code"

      - name: Upload vulnerability report
        if: steps.scan.outputs.code == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-monitor-report
          path: osv-report.md
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Keep the Issues-write token away from release assets and osv-scanner. This
  # job receives only the scanner's bounded exit code/tag plus its text report.
  report:
    needs: [prepare, scan]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.scan == 'true' &&
        needs.scan.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the scanner report artifact
      issues: write # open/update/close the sbom-vuln tracking issue
    steps:
      - name: Download vulnerability report
        if: needs.scan.outputs.code == '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-monitor-report

      - name: Open / update / close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CODE: ${{ needs.scan.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create sbom-vuln --color B60205 --force \
            --description "Vulnerability found in a shipped release's SBOM (sbom-monitor.yml)"
          mapfile -t existing < <(
            gh issue list --label sbom-vuln --state open --limit 100 \
              --json number --jq '.[].number'
          )

          if [ "$CODE" = "1" ]; then
            {
              echo "## 🛡️ Vulnerability in a shipped release ($TAG)"
              echo
              echo "osv-scanner found known vulnerabilities in the SBOM attached to release **$TAG** — the binary users have already downloaded. Source-tree scanners (cargo-audit / Dependabot) don't cover shipped artifacts; this is that gap (ADR-0034)."
              echo
              echo "- Re-scan run: $RUN_URL"
              echo "- Fix: bump the affected dependency and cut a patch release, or record an accepted/unfixable advisory in \`osv-scanner.toml\`."
              echo
              echo "<details><summary>osv-scanner report</summary>"
              echo
              cat osv-report.md
              echo
              echo "</details>"
            } > issue-body.md
            if [ "${#existing[@]}" -gt 0 ]; then
              primary=${existing[0]}
              gh issue edit "$primary" --body-file issue-body.md
              echo "Updated issue #$primary."
              for duplicate in "${existing[@]:1}"; do
                gh issue comment "$duplicate" \
                  --body "Superseded by the canonical tracking issue #$primary. Closing."
                gh issue close "$duplicate"
              done
            else
              gh issue create --title "Vulnerable dependency in shipped release $TAG" \
                --label sbom-vuln --body-file issue-body.md
            fi
            echo "::error::Known vulnerabilities remain in the shipped release $TAG."
            exit 1
          elif [ "$CODE" = "0" ]; then
            for issue in "${existing[@]}"; do
              gh issue comment "$issue" --body "Latest release ($TAG) SBOM is clean as of $RUN_URL. Closing."
              gh issue close "$issue"
            done
            echo "No vulnerabilities in $TAG."
          else
            echo "::error::osv-scanner exited unexpectedly with code $CODE."
            exit 1
          fi
