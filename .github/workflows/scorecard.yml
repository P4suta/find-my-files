# OpenSSF Scorecard: weekly supply-chain posture scan (pinned dependencies,
# token permissions, branch protection, SAST coverage, dangerous-workflow
# patterns, ...). Findings surface under Security > Code scanning; publish_results
# feeds the public Scorecard API that backs the README badge. Public repo only.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1" # Mondays, offset from the other weekly jobs (audit/codeql)
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Deny every implicit scope; the job below grants only what Scorecard needs.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the public Scorecard API (badge)
      contents: read
      actions: read # read workflow files for the token / pinned-deps checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Scorecard recommendation (no creds in checkout)

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Surface findings in the Security tab (and as PR/commit annotations).
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
