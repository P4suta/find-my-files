name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # Permission: Upload the SARIF scan result.
      id-token: write # Permission: Publish results to the Scorecard API.
      contents: read
      actions: read # Permission: Inspect workflow token and dependency pinning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
