nextest-version = "0.9.140"

[store]
dir = "../build/engine/nextest"

[profile.default]
fail-fast = false
retries = 0
flaky-result = "fail"
slow-timeout = { period = "15s", terminate-after = 4 }
leak-timeout = { period = "500ms", result = "fail" }
global-timeout = "15m"

[[profile.default.overrides]]
filter = "test(page_roundtrip_stays_inside_the_latency_budget)"
threads-required = "num-test-threads"

[profile.ci]
inherits = "default"

[profile.ci.junit]
path = "junit.xml"
report-name = "engine"

[profile.admin]
inherits = "ci"
test-threads = 1
slow-timeout = { period = "12m", terminate-after = 1 }
global-timeout = "45m"

[profile.admin.junit]
path = "admin.xml"
report-name = "engine-admin"

[profile.ci-latency]
inherits = "ci"

[profile.ci-latency.junit]
path = "latency.xml"
report-name = "engine-latency"

[profile.ci-coverage]
inherits = "ci"

[profile.ci-coverage.junit]
path = "coverage.xml"
report-name = "engine-coverage"
