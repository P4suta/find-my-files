[workspace]
resolver = "2"
members = [
  "crates/fmf-contract",
  "crates/fmf-core",
  "crates/fmf-runtime",
  "crates/fmf-ffi",
  "crates/fmf-cli",
  "crates/fmf-proto",
  "crates/fmf-service",
  "crates/fmf-launcher",
  "crates/fmf-buildstamp",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/P4suta/find-my-files"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
module_name_repetitions = "allow"
used_underscore_binding = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
option_if_let_else = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
lossy_float_literal = "deny"
verbose_file_reads = "deny"
try_err = "deny"
empty_structs_with_brackets = "deny"
unnecessary_self_imports = "deny"
if_then_some_else_none = "deny"
wildcard_dependencies = "deny"

[workspace.dependencies]
fmf-contract = { path = "crates/fmf-contract" }
fmf-core = { path = "crates/fmf-core" }
fmf-runtime = { path = "crates/fmf-runtime" }
fmf-proto = { path = "crates/fmf-proto" }
fmf-buildstamp = { path = "crates/fmf-buildstamp" }
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Services",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }
windows-service = "0.8"
memchr = "2"
rustc-hash = "2"
rayon = "1"
parking_lot = "0.12"
bytemuck = { version = "1.25.2", default-features = false }
crossbeam-channel = "0.5"
thiserror = "=2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
regex-syntax = "0.8"
unicode-normalization = "0.1"
clap = { version = "=4.6.3", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstream = "1.0"
anstyle = "1"
indicatif = "0.18"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
clap_complete = "4"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.release.package.fmf-proto]
overflow-checks = true
[profile.release.package.fmf-ffi]
overflow-checks = true
[profile.release.package.fmf-service]
overflow-checks = true
[profile.release.package.fmf-contract]
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = true
