[package]
name = "fmf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
fmf-proto = { path = "../crates/fmf-proto" }
fmf-core = { path = "../crates/fmf-core" }
fmf-runtime = { path = "../crates/fmf-runtime" }

[profile.release]
debug = true

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_decode"
path = "fuzz_targets/message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_parse"
path = "fuzz_targets/query_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_snapshot"
path = "fuzz_targets/index_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "usn_records"
path = "fuzz_targets/usn_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wtf8_decode"
path = "fuzz_targets/wtf8_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs_boot_sector"
path = "fuzz_targets/ntfs_boot_sector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs_file_record"
path = "fuzz_targets/ntfs_file_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs_attribute_list"
path = "fuzz_targets/ntfs_attribute_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs_extent_runs"
path = "fuzz_targets/ntfs_extent_runs.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "strict_json_decode"
path = "fuzz_targets/strict_json_decode.rs"
test = false
doc = false
bench = false
