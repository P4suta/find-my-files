commit-msg:
  jobs:
    - name: conventional-commit
      run: committed --commit-file {1}

pre-commit:
  parallel: true
  jobs:
    - name: typos
      run: just lint-text
    - name: rustfmt-engine
      glob: "engine/**/*.rs"
      run: just fmt-check-engine
    - name: rustfmt-fuzz
      glob: "engine/fuzz/**/*.rs"
      run: just fmt-check-fuzz
    - name: comments
      run: just lint-comments
    - name: rustfmt-xtask
      glob: "xtask/**/*.rs"
      run: just fmt-check-xtask
    - name: taplo
      glob:
        - "*.toml"
        - "**/*.toml"
      run: just fmt-check-toml

pre-push:
  parallel: true
  jobs:
    - name: perf-nudge
      glob: "engine/crates/{fmf-core,fmf-runtime}/**"
      run: echo "engine core/runtime changed — run 'just perf-gate' from an elevated shell before merging"

    - name: verify
      run: just verify-push
