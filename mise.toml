# Toolchain pinning for find-my-files.
# This machine manages tools via chezmoi + mise — do NOT install toolchains ad hoc;
# declare them here and run `mise install`.
min_version = "2026.7.5"

[tools]
rust = "1.96.1"
dotnet = "10.0.302"
# Prebuilt installer used by mise's cargo backend. It is a project pin, not a
# separately installed bootstrap prerequisite.
cargo-binstall = "1.21.1"
# Task runner (justfile). Declared here so `mise install` provisions it and CI
# (release.yml) builds the distributable via the same `just publish` recipe —
# no second copy of the bundling logic.
just = "1.54.0"
# Git-hook manager. `just setup` runs `lefthook install`; pinning it here closes a
# reproducibility gap (it was provisioned globally but never declared per-repo) and
# lets `just doctor` verify it. Registered mise short-name → aqua backend.
lefthook = "2.1.9"
# ETW-based sampling profiler (just profile) — pairs with the elevated
# terminals the engine already requires for real-volume work. cargo backend:
# the GitHub release tags (samply-v*) don't resolve via ubi/github backends.
"cargo:samply" = "0.13.1"
# Background cargo watcher for the engine inner loop (`just dev`): recompiles on
# save and surfaces only the errors. cargo backend, binstall-fetched like the rest.
"cargo:bacon" = "3.23.0"
# mdBook — renders docs/ (ADRs, security, research) into the published design-docs
# site (just doc / pages.yml). cargo backend, version-pinned like samply so CI
# and local builds match.
"cargo:mdbook" = "0.5.3"
# Quality-gate tooling (CI + `just cov`/`deny`/`machete`). cargo backend;
# cargo.binstall below fetches prebuilt binaries instead of compiling from
# source (compiling mdbook took ~2min in CI).
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-deny" = "0.19.9"
"cargo:cargo-machete" = "0.9.2"
# License-notice generation for the distributable bundle (`xtask publish` →
# THIRD-PARTY-NOTICES.txt, config engine/about.toml). CI installs this matching
# version with the checksummed release installer; mise owns only local
# provisioning. binstall-fetched locally.
"cargo:cargo-about" = "0.7.1"
# Mutation testing (`just mutants`) — surfaces tests that pass even when code is
# broken (the reveal-class gap, ADR-0022). binstall fetches the prebuilt binary.
"cargo:cargo-mutants" = "27.1.0"
# Formatter/linter binaries the just recipes, lefthook hooks and CI all invoke
# (taplo fmt --check, typos). Pinned here so local and CI use one version — they
# were previously assumed on PATH (a reproducibility gap).
"cargo:taplo-cli" = "0.10.0"
"cargo:typos-cli" = "1.47.2"
# Security-focused static analysis for GitHub Actions (template injection,
# ref confusion, excessive permissions, unpinned/mutable action references).
# actionlint remains the syntax/type/shellcheck half of the same gate.
"github:zizmorcore/zizmor" = "1.28.0"
# Conventional-Commits linter for the lefthook commit-msg hook (ADR-0035) — the
# local guard that keeps release-please's version + CHANGELOG derivation fed with
# well-formed commits. Same crate-ci family as typos; cargo backend, binstalled.
"cargo:committed" = "1.1.11"
# actionlint lints .github/workflows/*.yml (syntax, expression types, and
# shellcheck over run blocks). CI uses the repository-owned, SHA-256-verified
# upstream release installer; this matching local pin keeps workflow edits
# testable before push without making mise a CI runtime dependency.
"github:rhysd/actionlint" = "1.7.12"

# UI automation is a release gate. Fetch Microsoft's native x64 release archive
# directly: no Node/package-manager chain, and both identity and bytes are pinned.
[tools."http:winappcli"]
version = "0.5.0"
url = "https://github.com/microsoft/winappCli/releases/download/v{{ version }}/winappcli-x64.zip"
checksum = "sha256:88735ce6c2582ac5fac6200194bf62467fdd72b44b2d230f3a4ed059fa79ee7d"
size = "37881954"
os = ["windows/x64"]
version_list_url = "https://api.github.com/repos/microsoft/winappCli/releases/latest"
version_json_path = ".tag_name"

[settings]
# Use the project-pinned cargo-binstall for cargo: backend tools when a matching
# upstream binary exists; mise retains its normal source-build fallback.
cargo.binstall = true
