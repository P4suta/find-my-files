# xtask is an independent Cargo workspace and therefore owns an independent
# nextest policy file (ADR-0041).
nextest-version = "0.9.140"

[store]
dir = "../build/xtask/nextest"

[profile.default]
fail-fast = false
retries = 0
flaky-result = "fail"
slow-timeout = { period = "15s", terminate-after = 4 }
leak-timeout = { period = "500ms", result = "fail" }
global-timeout = "5m"

[profile.ci]
inherits = "default"

[profile.ci.junit]
path = "junit.xml"
report-name = "xtask"
